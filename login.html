<!doctype html>
<html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0754c8"><title>Konekte — Ti Kanè m</title><link rel="stylesheet" href="public/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="public/supabase-config.js" defer></script></head><body><main id="app" class="app"><section class="screen fade"><header class="hero"><div class="topbar"><a class="iconbtn" href="./">‹</a><div class="brand"><div class="logo-mark">TM</div><div><b>Ti Kanè m</b><small>Sere jodi, bati demen.</small></div></div><span></span></div><h1 class="title" style="color:#fff">Byenveni tounen !</h1><div style="opacity:.85">Konekte ak kont ou</div></header><div class="content"><div class="card"><h2 class="title">Konekte</h2><p class="muted">Antre enfòmasyon kont ou.</p><label>Imèl<input id="loginEmail" class="input" type="email" placeholder="egzanp@email.com" autocomplete="email"></label><label>Modpas<div style="position:relative"><input id="loginPass" class="input" style="padding-right:48px" type="password" placeholder="••••••••" autocomplete="current-password"><button id="passwordToggle" type="button" style="position:absolute;right:7px;top:7px;width:38px;height:38px;border-radius:10px;background:#edf4ff;color:#0754c8;font-size:18px">👁</button></div></label><label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700"><input id="rememberMe" type="checkbox" style="width:18px;height:18px"> Sonje imèl mwen</label><button id="loginButton" class="btn blue" type="button">Konekte</button><a class="btn ghost" href="reset-password.html" style="display:block;text-align:center;text-decoration:none">Modpas bliye?</a><a class="btn ghost" href="register.html" style="display:block;text-align:center;text-decoration:none">Kreye yon kont</a><div id="loginStatus" class="muted" style="display:none;text-align:center;margin-top:10px"></div></div></div></section></main><div id="toast" class="toast"></div><script>
(function(){
  const byId=id=>document.getElementById(id);
  function message(text){const t=byId('toast'),s=byId('loginStatus');if(t){t.textContent=text;t.style.display='block';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.style.display='none',3200)}if(s){s.textContent=text;s.style.display='block'}}
  function toggle(){const i=byId('loginPass'),b=byId('passwordToggle');if(!i)return;const show=i.type==='password';i.type=show?'text':'password';if(b)b.textContent=show?'🙈':'👁'}
  async function getClient(){
    for(let i=0;i<50;i++){
      if(window.supabase&&window.TIKANE_SUPABASE){try{return window.supabase.createClient(window.TIKANE_SUPABASE.url,window.TIKANE_SUPABASE.anonKey)}catch(e){console.error(e);return null}}
      await new Promise(r=>setTimeout(r,100));
    }
    return null;
  }
  async function login(){
    const email=(byId('loginEmail')?.value||'').trim(),password=byId('loginPass')?.value||'',btn=byId('loginButton');
    if(!email||!password){message('Tanpri ranpli imèl ak modpas la.');return}
    if(!/^\S+@\S+\.\S+$/.test(email)){message('Tanpri antre yon imèl ki valab.');return}
    if(btn){btn.disabled=true;btn.textContent='Konekte...'}
    message('Ap verifye kont ou...');
    try{
      const client=await getClient();
      if(!client)throw new Error('Koneksyon ak sèvè a pa disponib.');
      const {data,error}=await client.auth.signInWithPassword({email,password});
      if(error)throw error;
      if(byId('rememberMe')?.checked)localStorage.setItem('tikane_login_email',email);else localStorage.removeItem('tikane_login_email');
      message('Koneksyon reyisi.');
      const name=data.user?.user_metadata?.full_name||'Itilizatè';
      byId('app').innerHTML='<section class="screen fade"><header class="hero"><div class="topbar"><span></span><div class="brand"><div class="logo-mark">TM</div><div><b>Ti Kanè m</b><small>Sere jodi, bati demen.</small></div></div><a class="iconbtn" href="./">⌂</a></div></header><div class="content"><div class="card"><small>☀️ Bonjou</small><h2 class="title">'+String(name).replace(/[&<>\"']/g,'')+'</h2><p class="muted">Ou konekte avèk siksè.</p><a class="btn primary" href="./">Ale nan Akèy</a></div></div></section>';
    }catch(err){console.error('Ti Kanè m login:',err);message(err?.message||'Koneksyon an echwe. Verifye imèl ak modpas la.');if(btn){btn.disabled=false;btn.textContent='Konekte'}}
  }
  window.togglePassword=toggle;window.doLogin=login;
  document.addEventListener('DOMContentLoaded',()=>{const saved=localStorage.getItem('tikane_login_email'),email=byId('loginEmail'),remember=byId('rememberMe');if(saved&&email&&remember){email.value=saved;remember.checked=true}byId('passwordToggle')?.addEventListener('click',toggle);byId('loginButton')?.addEventListener('click',login)});
})();
</script></body></html>
