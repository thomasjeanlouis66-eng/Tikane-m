<!doctype html>
<html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0754c8"><title>Konekte — Ti Kanè m</title><link rel="stylesheet" href="public/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="public/supabase-config.js" defer></script></head><body><main id="app" class="app"><section class="screen fade"><header class="hero"><div class="topbar"><a class="iconbtn" href="./">‹</a><div class="brand"><div class="logo-mark">TM</div><div><b>Ti Kanè m</b><small>Sere jodi, bati demen.</small></div></div><span></span></div><h1 class="title" style="color:#fff">Byenveni tounen !</h1><div style="opacity:.85">Konekte ak kont ou</div></header><div class="content"><div class="card"><h2 class="title">Konekte</h2><p class="muted">Antre enfòmasyon kont ou.</p><label>Imèl<input id="loginEmail" class="input" type="email" placeholder="egzanp@email.com" autocomplete="email"></label><label>Modpas<div style="position:relative"><input id="loginPass" class="input" style="padding-right:48px" type="password" placeholder="••••••••" autocomplete="current-password"><button type="button" onclick="togglePassword()" style="position:absolute;right:7px;top:7px;width:38px;height:38px;border-radius:10px;background:#edf4ff;color:#0754c8;font-size:18px">👁</button></div></label><label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700"><input id="rememberMe" type="checkbox" style="width:18px;height:18px"> Sonje imèl mwen</label><button class="btn blue" onclick="doLogin()">Konekte</button><a class="btn ghost" href="reset-password.html" style="display:block;text-align:center;text-decoration:none">Modpas bliye?</a><a class="btn ghost" href="register.html" style="display:block;text-align:center;text-decoration:none">Kreye yon kont</a></div></div></section></main><div id="toast" class="toast"></div><script>function togglePassword(){const i=document.getElementById('loginPass'),b=document.querySelector('button[onclick="togglePassword()"]');if(!i)return;const s=i.type==='password';i.type=s?'text':'password';if(b)b.textContent=s?'🙈':'👁'}document.addEventListener('DOMContentLoaded',()=>{const s=localStorage.getItem('tikane_login_email');if(s){document.getElementById('loginEmail').value=s;document.getElementById('rememberMe').checked=true}});</script></body></html>
