<!doctype html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0754c8">
  <title>Enskri — Ti Kanè m</title>

  <link rel="stylesheet" href="public/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="public/supabase-config.js" defer></script>
</head>

<body>
<main id="app" class="app">

  <section class="screen fade">

    <header class="hero">
      <div class="topbar">
        <a class="iconbtn" href="./">‹</a>

        <div class="brand">
          <div class="logo-mark">TM</div>
          <div>
            <b>Ti Kanè m</b>
            <small>Sere jodi, bati demen.</small>
          </div>
        </div>

        <span></span>
      </div>

      <h1 class="title" style="color:#fff">Kreye kont</h1>
      <div style="opacity:.85">Enskri pou kòmanse</div>
    </header>

    <div class="content">
      <div class="card">

        <h2 class="title">Nou kontan wè w</h2>

        <label>
          Non konplè
          <input
            id="regName"
            class="input"
            placeholder="Non ou"
            autocomplete="name">
        </label>

        <label>
          Imèl
          <input
            id="regEmail"
            class="input"
            type="email"
            placeholder="egzanp@email.com"
            autocomplete="email">
        </label>

        <label>
          Telefòn
          <input
            id="regPhone"
            class="input"
            placeholder="+509 ..."
            autocomplete="tel">
        </label>

        <label>
          Modpas
          <input
            id="regPass"
            class="input"
            type="password"
            placeholder="Omwen 6 karaktè"
            autocomplete="new-password">
        </label>

        <button
          id="registerButton"
          class="btn primary"
          type="button"
          onclick="doRegister()">
          Kreye kont
        </button>

        <a class="btn ghost" href="login.html">
          Mwen deja gen kont
        </a>

        <div
          id="registerStatus"
          class="muted"
          style="display:none;text-align:center;margin-top:10px">
        </div>

      </div>
    </div>

  </section>

</main>

<div id="toast" class="toast"></div>

<script>
(function(){

  const byId = id => document.getElementById(id);

  function message(text){
    const toast = byId('toast');
    const status = byId('registerStatus');

    if(toast){
      toast.textContent = text;
      toast.style.display = 'block';

      clearTimeout(window.__toastTimer);

      window.__toastTimer = setTimeout(() => {
        toast.style.display = 'none';
      }, 4000);
    }

    if(status){
      status.textContent = text;
      status.style.display = 'block';
    }
  }

  async function getClient(){

    for(let i = 0; i < 50; i++){

      if(
        window.supabase &&
        window.TIKANE_SUPABASE &&
        window.TIKANE_SUPABASE.url &&
        window.TIKANE_SUPABASE.anonKey
      ){
        try{
          return window.supabase.createClient(
            window.TIKANE_SUPABASE.url,
            window.TIKANE_SUPABASE.anonKey
          );
        }catch(e){
          console.error('Supabase client:', e);
          return null;
        }
      }

      await new Promise(resolve => setTimeout(resolve,100));
    }

    return null;
  }

  async function doRegister(){

    const name = (byId('regName')?.value || '').trim();
    const email = (byId('regEmail')?.value || '').trim();
    const phone = (byId('regPhone')?.value || '').trim();
    const password = byId('regPass')?.value || '';
    const button = byId('registerButton');

    if(!name){
      message('Tanpri antre non konplè ou.');
      return;
    }

    if(!email){
      message('Tanpri antre imèl ou.');
      return;
    }

    if(!/^\S+@\S+\.\S+$/.test(email)){
      message('Tanpri antre yon imèl ki valab.');
      return;
    }

    if(password.length < 6){
      message('Modpas la dwe gen omwen 6 karaktè.');
      return;
    }

    if(button){
      button.disabled = true;
      button.textContent = 'Ap kreye kont...';
    }

    message('Ap kreye kont ou...');

    try{

      const client = await getClient();

      if(!client){
        throw new Error('Koneksyon ak Supabase pa disponib.');
      }

      const { data, error } = await client.auth.signUp({

        email: email,

        password: password,

        options: {
          data: {
            full_name: name,
            phone: phone
          }
        }

      });

      if(error) throw error;

      /*
       * Si Supabase mande verifikasyon imèl,
       * itilizatè a ap resevwa mesaj la.
       */
      if(data.user && !data.session){

        message(
          'Kont la kreye. Verifye imèl ou pou aktive kont lan, epi konekte.'
        );

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2500);

        return;
      }

      /*
       * Si konfimasyon imèl pa obligatwa,
       * itilizatè a deja konekte.
       */
      if(data.session){

        message('Kont la kreye avèk siksè!');

        setTimeout(() => {
          window.location.href = './';
        }, 1200);

        return;
      }

      message('Kont la kreye. Tanpri konekte.');

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1800);

    }catch(err){

      console.error('Ti Kanè m registration:', err);

      let text = err?.message || 'Kreyasyon kont lan echwe.';

      if(text.toLowerCase().includes('user already registered')){
        text = 'Gen yon kont ki deja itilize imèl sa a.';
      }

      if(text.toLowerCase().includes('password')){
        text = 'Modpas la pa aksepte. Sèvi ak omwen 6 karaktè.';
      }

      message(text);

      if(button){
        button.disabled = false;
        button.textContent = 'Kreye kont';
      }
    }
  }

  window.doRegister = doRegister;

})();
</script>

</body>
</html>
