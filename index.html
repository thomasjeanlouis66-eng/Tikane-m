<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0754c8"><title>Ti Kanè m</title><style>:root{--b:#0754c8;--y:#ffd51c;--ink:#123b78;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:#e8edf5;font-family:Arial;color:var(--ink);display:flex;justify-content:center}.phone{width:min(100%,480px);min-height:100vh;background:var(--bg);position:relative}.screen{min-height:100vh;padding-bottom:78px}.blue,.profile{color:#fff;padding:14px 16px;background:linear-gradient(160deg,#0847aa,#075fe0)}.top{display:flex;align-items:center;gap:10px}.brand{font-weight:800;font-size:20px}.tag{font-size:12px;color:#ffe53a}.back{font-size:28px;border:0;background:none;color:#fff}.logo{display:flex;align-items:center;gap:8px;font-weight:900}.logo b{display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:#fff;color:var(--b)}.logo span{font-size:20px}.content{padding:14px 18px}.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--b);color:#fff;font-weight:800;cursor:pointer}.yellow{background:var(--y);color:var(--ink)}.row{display:flex;gap:10px}.row>*{flex:1}.card{background:#fff;border:1px solid #e0e7f0;border-radius:15px;padding:14px;margin:10px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);height:68px;background:#fff;border-top:1px solid #dce4ee;display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav{border:0;background:none;color:#174d93;font-size:11px;font-weight:700}.nav span{display:block;font-size:22px}.nav.active{color:var(--b)}.profilebox{display:flex;gap:12px;align-items:center}.big{width:72px;height:72px;border-radius:50%;border:3px solid #fff;overflow:hidden;display:grid;place-items:center;background:#0b5ed7;font-weight:900}.avatar{width:100%;height:100%;object-fit:cover}.sm{width:50px;height:50px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#0b5ed7;color:#fff;font-weight:900;flex:none}.photoBtn{border:0;border-radius:9px;padding:7px 10px;margin-top:6px;font-weight:800;color:var(--b)}.online{color:#20d27b;font-size:12px}.menurow{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid #e8edf4;font-weight:700}.menurow button{border:0;background:none;color:inherit;font:inherit;text-align:left;flex:1}.drawer{position:fixed;inset:0;background:#0006;z-index:40;display:none}.drawer.open{display:block}.drawerbox{position:absolute;left:0;top:0;bottom:0;width:min(86%,390px);background:#fff;padding:22px 18px}.draweritem{display:flex;gap:13px;width:100%;padding:15px 8px;border:0;background:#fff;text-align:left;font-weight:800;color:var(--ink)}.closemenu{border:0;border-radius:50%;padding:8px}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#123b78;color:#fff;padding:10px 14px;border-radius:10px;z-index:50}.media-bar{display:flex;gap:7px;margin-top:10px}.media-btn{border:1px solid #d8e2ef;background:#fff;border-radius:10px;padding:9px;font-size:18px}.composer{display:flex;gap:7px;margin-top:10px}.composer input{flex:1;border:1px solid #d8e2ef;border-radius:12px;padding:11px}.send{border:0;background:var(--b);color:#fff;border-radius:12px;padding:11px}.media-preview{display:none;background:#eef4fa;border-radius:12px;padding:9px;margin-top:9px}.chat-media{max-width:100%;border-radius:10px;margin-top:6px}</style></head><body><main class="phone" id="app"></main><div id="toast"></div><div id="menuDrawer" class="drawer" onclick="closeMenu(event)"><div class="drawerbox" onclick="event.stopPropagation()"><div class="top" style="justify-content:space-between"><b>Ti Kanè m</b><button class="closemenu" onclick="closeMenu()">×</button></div><hr><button class="draweritem" onclick="gm('home')">🏠 Akèy</button><button class="draweritem" onclick="gm('plans')">📋 Plan yo</button><button class="draweritem" onclick="gm('chat')">💬 Chat</button><button class="draweritem" onclick="gm('market')">🛒 Marketplace</button><button class="draweritem" onclick="gm('profile')">👤 Pwofil</button><button class="draweritem" onclick="gm('admin')">🔐 Admin</button><button class="draweritem" onclick="shareApp()">📤 Pataje</button></div></div><input id="photoInput" type="file" accept="image/*" hidden onchange="setPhoto(event)"><input id="chatPhotoInput" type="file" accept="image/*" hidden onchange="setChatPhoto(event)"><input id="videoInput" type="file" accept="video/*" hidden onchange="media(event,'video')"><input id="fileInput" type="file" hidden onchange="media(event,'file')"><script>const plans=[['Plan 1','5G'],['Plan 2','10G'],['Plan 3','25G'],['Plan 4','50G'],['Plan 5','100G'],['Plan 6','250G'],['Plan 7','500G'],['Plan 8','1000G']];let st={screen:'home',photo:localStorage.getItem('tm_photo')||'',chatPhoto:localStorage.getItem('tm_chat_photo')||''};const app=document.getElementById('app');function logo(){return'<div class="logo"><b>TM</b><span>Ti Kanè m</span></div>'}function head(t,sub='',back=true){return'<div class="blue"><div class="top">'+(back?'<button class="back" onclick="go(\'home\')">‹</button>':'')+logo()+'<div><div class="brand">'+t+'</div><div class="tag">'+sub+'</div></div></div></div>'}function nav(a){return'<div class="bottom"><button class="nav" onclick="openMenu()"><span>⌂</span>Menu</button><button class="nav '+(a==='chat'?'active':'')+'" onclick="go(\'chat\')"><span>◌</span>Chat</button><button class="nav '+(a==='market'?'active':'')+'" onclick="go(\'market\')"><span>▦</span>Marketplace</button><button class="nav '+(a==='profile'?'active':'')+'" onclick="go(\'profile\')"><span>♙</span>Pwofil</button></div>'}function av(photo,cls){return photo?'<img class="'+cls+' avatar" src="'+photo+'">':'<div class="'+cls+'">TM</div>'}function profile(){let r=[['♟','Enfòmasyon mwen','info'],['▣','Plan mwen yo','plans'],['▣','Peman mwen yo','payments'],['⚙','Sèvi','support'],['♢','Anviwònman','settings'],['?','Sant èd','help']];return'<section class="screen"><div class="profile">'+head('Pwofil','',true).replace('class="blue"','class="profile"')+'<div class="profilebox" style="margin-top:14px">'+av(st.photo,'big')+'<div><div class="brand">Jean Pierre</div><div>+509 3726 4589</div><div class="online">● Online</div><button class="photoBtn" onclick="choosePhoto()">📷 Chanje foto</button></div></div></div><div class="content">'+r.map(x=>'<div class="menurow"><span>'+x[0]+'</span><button onclick="pa(\''+x[2]+'\')">'+x[1]+'</button><span>›</span></div>').join('')+'</div>'+nav('profile')+'</section>'}function pa(x){if(x==='plans')go('plans');else if(x==='info')simple('Enfòmasyon mwen');else if(x==='payments')simple('Peman mwen yo');else if(x==='settings')simple('Anviwònman');else toast(x==='support'?'Sèvi: sèvis sipò a ap prepare ✔':'Sant èd: seksyon èd la ap prepare ✔')}function choosePhoto(){document.getElementById('photoInput').click()}function setPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{st.photo=r.result;localStorage.setItem('tm_photo',st.photo);render();toast('Foto pwofil la mete ✔')};r.readAsDataURL(f)}function setChatPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{st.chatPhoto=r.result;localStorage.setItem('tm_chat_photo',st.chatPhoto);render();toast('Foto pwofil Chat la mete ✔')};r.readAsDataURL(f)}function simple(t){app.innerHTML='<section class="screen">'+head(t)+'<div class="content"><div class="card"><h3>'+t+'</h3><p>Seksyon sa a pare.</p><button class="btn" onclick="go(\'profile\')">← Retounen</button></div></div>'+nav('profile')+'</section>'}function plansScreen(){return'<section class="screen">'+head('Chwazi plan ou','8 plan • 2×4',false)+'<div class="content"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">'+plans.map(p=>'<button class="btn" onclick="go(\'detail\')"><small>'+p[0]+'</small><strong style="display:block;color:var(--y);font-size:18px;margin:8px 0">'+p[1]+'</strong><small>Jou</small></button>').join('')+'</div></div></section>'}function home(){return'<section class="screen">'+head('Ti Kanè m','Sere jodi, jwenn demen.',false)+'<div class="content"><h3>Fonksyonalite yo</h3><div class="row"><button class="btn" onclick="go(\'chat\')">💬<br>Chat</button><button class="btn yellow" onclick="go(\'market\')">🛒<br>Marketplace</button></div></div>'+nav('home')+'</section>'}function chat(){return'<section class="screen">'+head('Chat')+'<div class="content"><div class="card" onclick="go(\'conversation\')" style="display:flex;align-items:center;gap:12px">'+av(st.chatPhoto,'sm')+'<div><b>Jean Pierre</b><br><small>Mèsi anpil 🙏</small></div></div></div>'+nav('chat')+'</section>'}function conversation(){return'<section class="screen">'+head('Jean Pierre','🟢 Online')+'<div class="content"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'+av(st.chatPhoto,'sm')+'<b>Jean Pierre</b><button class="photoBtn" onclick="document.getElementById(\'chatPhotoInput\').click()">📷</button></div><div id="msgs" class="card">Bonjour frè, ou la?<br><br>Wi, m la.</div><div id="preview" class="media-preview"></div><div class="media-bar"><button class="media-btn" onclick="document.getElementById(\'photoInput\').click()">📷</button><button class="media-btn" onclick="document.getElementById(\'videoInput\').click()">🎥</button><button class="media-btn" onclick="document.getElementById(\'fileInput\').click()">📎</button><button class="media-btn" onclick="toast('Mesaj vokal pare pou konekte ak mikwo a')">🎤</button></div><div class="composer"><input id="txt" placeholder="Ekri yon mesaj..."><button class="send" onclick="send()">Voye</button></div></div></section>'}function media(e,t){let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f),p=document.getElementById('preview');p.style.display='block';p.innerHTML=t==='video'?'<b>🎥 '+f.name+'</b><br><video class="chat-media" controls src="'+u+'"></video>':'<b>📎 '+f.name+'</b>';e.target.value=''}function send(){let i=document.getElementById('txt'),t=i.value.trim();if(!t)return;document.getElementById('msgs').innerHTML+='<br><br><b>Ou:</b> '+t.replace(/[&<>]/g,'');i.value=''}function market(){return'<section class="screen">'+head('Marketplace')+'<div class="content"><div class="card">📱 Samsung A14<br><b>22,000 G</b></div><div class="card">💻 Laptop HP<br><b>45,000 G</b></div></div>'+nav('market')+'</section>'}function admin(){return'<section class="screen">'+head('Admin','Administrasyon Ti Kanè m')+'<div class="content"><div class="card"><h3>🔐 Zòn Admin</h3><p>Espas administratè a pare.</p></div></div>'+nav('home')+'</section>'}function openMenu(){document.getElementById('menuDrawer').classList.add('open')}function closeMenu(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('menuDrawer').classList.remove('open')}function gm(s){closeMenu();go(s)}function shareApp(){let u=location.href;if(navigator.share)navigator.share({title:'Ti Kanè m',text:'Gade Ti Kanè m.',url:u});else navigator.clipboard?.writeText(u).then(()=>toast('Lyen kopye ✔'))}function go(s){st.screen=s;render();scrollTo(0,0)}function toast(t){let e=document.getElementById('toast');e.innerHTML='<div class="toast">'+t+'</div>';setTimeout(()=>e.innerHTML='',2200)}function render(){let s=st.screen;app.innerHTML=s==='plans'?plansScreen():s==='chat'?chat():s==='conversation'?conversation():s==='market'?market():s==='admin'?admin():s==='profile'?profile():s==='profileInfo'?simple('Enfòmasyon mwen'):s==='payments'?simple('Peman mwen yo'):s==='settings'?simple('Anviwònman'):home()}render();</script></body></html>
