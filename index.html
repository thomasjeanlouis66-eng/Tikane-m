<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0754c8"><title>Ti Kanè m</title>
<style>
:root{--blue:#0754c8;--blue2:#0b66e8;--yellow:#ffd51c;--ink:#123b78;--muted:#667b9b;--line:#dfe6ef;--bg:#f5f7fb;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#e8edf5;color:#123b78}body{display:flex;justify-content:center}.phone{width:min(100%,480px);min-height:100vh;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 30px #0002}.screen{min-height:100vh;padding-bottom:78px}.hidden{display:none!important}.bluehead{background:linear-gradient(160deg,#0847aa,#075fe0);color:#fff;padding:14px 18px 12px}.top{display:flex;align-items:center;gap:10px}.top img{width:46px;height:46px;object-fit:contain}.brand{font-weight:800;font-size:21px}.tag{font-size:12px;color:#ffe53a;margin-top:2px}.lang{margin-left:auto;background:#fff;color:#174c9d;border-radius:18px;padding:8px 11px;font-size:12px;font-weight:700}.back{font-size:28px;background:none;border:0;color:#fff;padding:0 4px}.hero{background:linear-gradient(180deg,#0757c9,#073d91);color:#fff;padding:20px 20px 28px;min-height:330px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;right:-80px;bottom:-120px;background:#fff2}.hero img{width:100%;max-height:190px;object-fit:cover;border-radius:18px;opacity:.95}.hero h1{font-size:28px;margin:28px 0 8px;color:#fff}.hero h1 b{color:var(--yellow)}.hero p{font-size:18px;margin:0 0 16px}.curve{height:35px;background:var(--yellow);border-radius:60% 60% 0 0/100% 100% 0 0;position:absolute;bottom:-19px;left:-10%;width:120%}.paystrip{background:#fff;margin:-8px 18px 14px;border-radius:18px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 3px 12px #0001;position:relative;z-index:2}.paystrip a{color:var(--ink);text-decoration:none;text-align:center;font-size:12px;font-weight:800;border-right:1px solid var(--line)}.paystrip a:last-child{border:0}.payicon{font-size:22px;display:block;margin-bottom:5px}.content{padding:14px 18px}.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;cursor:pointer}.btn.yellow{background:var(--yellow);color:#123b78}.btn.full{width:100%}.row{display:flex;gap:10px}.row>*{flex:1}.field{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;color:#587096}.field input,.field select{border:0;outline:0;width:100%;font-size:14px;color:#274e82;background:transparent}.card{background:#fff;border:1px solid #e0e7f0;border-radius:15px;padding:14px;box-shadow:0 2px 8px #0000000a;margin:10px 0}.check{color:#0a51bd;font-weight:700}.gridplans{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.plan{background:linear-gradient(160deg,#0754c8,#0a72e8);color:#fff;border-radius:12px;padding:12px 6px;text-align:center;border:0;min-height:105px;cursor:pointer}.plan small{display:block}.plan strong{display:block;color:var(--yellow);font-size:19px;margin:8px 0}.dots{text-align:center;color:#b8c3d1;font-size:25px;letter-spacing:5px}.dots b{color:var(--blue)}.feature{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:12px;margin:8px 0;border:1px solid var(--line)}.feature .ico{font-size:22px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);height:68px;background:#fff;border-top:1px solid #dce4ee;display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav{border:0;background:none;color:#174d93;font-size:11px;font-weight:700}.nav.active{color:var(--blue)}.nav span{display:block;font-size:22px;margin-bottom:2px}.listitem{display:flex;gap:11px;align-items:center;padding:12px 2px;border-bottom:1px solid #e8edf4}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#d9e7fb}.grow{flex:1}.name{font-weight:800;color:#193f78}.preview{font-size:12px;color:#6e829f;margin-top:4px}.time{font-size:11px;color:#8090a6}.badge{background:var(--blue);color:#fff;border-radius:20px;padding:4px 7px;font-size:10px}.tabs{display:flex;gap:8px;background:#fff;padding:8px;border-radius:20px;margin:10px 0}.tab{flex:1;border:0;border-radius:18px;background:#fff;padding:8px;font-weight:700;color:#3d5e8e}.tab.active{background:var(--blue);color:#fff}.chat{padding:12px 16px}.bubble{max-width:78%;padding:10px 12px;border-radius:15px;margin:8px 0;font-size:13px}.left{background:#fff;border:1px solid #e2e8f0}.right{margin-left:auto;background:#0966dc;color:#fff}.composer{position:fixed;bottom:68px;width:min(100%,480px);background:#fff;padding:8px 10px;display:flex;gap:7px;border-top:1px solid var(--line)}.composer input{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px}.products{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product{background:#fff;border-radius:12px;border:1px solid #e1e8f0;overflow:hidden}.product img{width:100%;height:130px;object-fit:cover;background:#eef2f8}.product .pbody{padding:9px}.price{color:#d69f00;font-weight:900}.profilehead{background:linear-gradient(160deg,#0754c8,#0a69dd);padding:18px;color:#fff}.profilebox{display:flex;gap:12px;align-items:center}.bigavatar{width:68px;height:68px;border-radius:50%;border:3px solid #fff;object-fit:cover}.online{color:#20d27b;font-size:12px}.menurow{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid #e8edf4;font-weight:700}.menurow span:first-child{font-size:20px}.menurow span:last-child{margin-left:auto}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#123b78;color:#fff;padding:10px 14px;border-radius:10px;z-index:50;font-size:12px}.splash{min-height:100vh;background:linear-gradient(160deg,#0754c8,#062f77);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:48px 28px 28px;position:relative}.logoMark{display:flex;align-items:center;gap:8px;color:#fff;font-weight:900}.logoMark b{display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:#fff;color:#0754c8;font-size:24px;box-shadow:0 3px 8px #0002}.logoMark span{font-size:20px}.splash .logo{width:110px}.heroImg{width:100%;height:170px;border-radius:18px;background:linear-gradient(135deg,#0a67d9,#07347f);display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;font-weight:900;font-size:24px;position:relative;overflow:hidden}.heroImg:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-50px;background:#ffd51c55}.heroImg small{font-size:12px;color:#ffd51c;margin-top:4px}.splash h1{font-size:30px;margin:22px 0 8px}.splash h1 b{color:var(--yellow)}.splash .paystrip{margin:0;position:relative}.splash .bottomtext{text-align:center}.splash .dots{color:#fff}.splash .dots b{color:var(--yellow)}
@media(max-width:360px){.gridplans{gap:6px}.plan{padding:9px 3px}.hero h1{font-size:24px}}
</style></head>
<body><main class="phone" id="app"></main><div id="toast"></div>
<script>
const plans=[['Plan 1','50G'],['Plan 2','100G'],['Plan 3','25G'],['Plan 4','500G'],['Plan 5','250G'],['Plan 6','1000G'],['Plan 7','5G'],['Plan 8','10G']];
let state={screen:'splash',plan:null,logged:false};
const app=document.getElementById('app');
function img(name,cls=''){if(name==='tikanem-logo.png') return `<div class="${cls} logoMark"><b>TM</b><span>Ti Kanè m</span></div>`; return `<div class="${cls} heroImg"><span>Ti Kanè m</span><small>Sere jodi, jwenn demen.</small></div>`}
function head(title,sub='',back=true){return `<div class="bluehead"><div class="top">${back?'<button class="back" onclick="go(\'home\')">‹</button>':''}${img('tikanem-logo.png') }<div><div class="brand">${title}</div>${sub?`<div class="tag">${sub}</div>`:''}</div><div class="lang">🌐 Kreyòl⌄</div></div></div>`}
function nav(active){return `<div class="bottom"><button class="nav ${active==='home'?'active':''}" onclick="go('home')"><span>⌂</span>Menu</button><button class="nav ${active==='chat'?'active':''}" onclick="go('chat')"><span>◌</span>Chat</button><button class="nav ${active==='market'?'active':''}" onclick="go('market')"><span>▦</span>Marketplace</button><button class="nav ${active==='profile'?'active':''}" onclick="go('profile')"><span>♙</span>Pwofil</button></div>`}
function splash(){return `<section class="splash"><div>${img('tikanem-logo.png','logo')}<h1>Kòmanse bati<br><b>pwojè w</b></h1><p style="font-size:18px">Chwazi plan.</p><div style="margin-top:130px">${img('header.jpg')}</div></div><div><div class="paystrip"><a>🔴<br>NatCash</a><a>🔴<br>MonCash</a><a>▣<br>Cash</a></div><p style="text-align:center">🛡️ Peman fasil • Rapid • Sekirite 🛡️</p><div class="dots"><b>●</b> ● ●</div></div></section>`}
function login(){return `<section class="screen"><div class="content" style="padding-top:22px">${img('tikanem-logo.png','') }<div class="row" style="margin:18px 0"><button class="btn">Konekte</button><button class="btn" style="background:#edf3fb;color:#16498b">Enskri</button></div><div class="field">👤 <input placeholder="Imèl oswa telefòn"></div><div class="field">🔒 <input type="password" placeholder="Modpas"><span>◉</span></div><div style="display:flex;justify-content:space-between;font-size:12px"><label><input type="checkbox"> Sonje mwen</label><a>Blije modpas?</a></div><button class="btn full" style="margin-top:16px" onclick="go('plans')">Konekte</button><div style="text-align:center;margin:18px">— oswa —</div><div class="row"><button class="btn" style="background:#fff;color:#234b83;border:1px solid var(--line)">🇬 Google</button><button class="btn" style="background:#fff;color:#234b83;border:1px solid var(--line)">ⓕ Facebook</button></div><p style="text-align:center;font-size:12px;margin-top:18px">Pa gen kont? <b>Enskri kounye a</b></p></div></section>`}
function plansScreen(){return `<section class="screen">${head('Ti Kanè m','Sere jodi, jwenn demen. ',false)}<div class="content"><h1 style="margin:10px 0 2px;color:#173f79">Chwazi plan ou</h1><b style="color:#d9a900">8 plan sèlman • 2×4 (yon sèl fwa)</b><div class="gridplans" style="margin-top:18px">${plans.map((p,i)=>`<button class="plan" onclick="selectPlan('${p[1]}')"><small>${p[0]}</small>♙<strong>${p[1]}</strong><small>Jou</small></button>`).join('')}</div><button class="btn full" style="margin-top:18px">📡 Tipike mobile　›</button><div class="dots"><b>●</b> ● ●</div></div></section>`}
function detail(){let p=state.plan||'250G';return `<section class="screen">${head('Plan 5 - ${p}','Tipike mobile') }<div class="content"><div class="card" style="background:linear-gradient(160deg,#0754c8,#0b6be4);color:#fff;text-align:center"><div style="font-size:42px">🌐　<b style="font-size:34px">${p}</b></div><b>Jou</b><div style="background:var(--yellow);color:#173f79;border-radius:15px;display:inline-block;padding:6px 20px;margin-top:8px;font-size:12px;font-weight:800">Plan Progressif</div></div><h3>Detay plan an</h3><p class="check">✔　Lajan: ${p}</p><p class="check">✔　Dire: 50 jou</p><p class="check">✔　Tipike mobile</p><p class="check">✔　Ka gen plizyè sik (cycle)</p><button class="btn yellow full" onclick="go('request')">Mande plan sa a</button></div></section>`}
function request(){return `<section class="screen">${head('Mande plan') }<div class="content"><div class="card"><b>🌐　Plan 5 - ${state.plan||'250G'}</b><p>Tipike mobile</p></div><div class="field">👤　<input placeholder="Non konplè"></div><div class="field">☎　<input placeholder="Telefòn"></div><div class="field">▣　<input type="date" placeholder="Dat kòmanse"></div><button class="btn full" onclick="toast('Demann lan anrejistre ✔');go('home')">Konfime</button><p style="font-size:12px;text-align:center;margin-top:20px">🛡️ Yon seleksyon pa aktive plan an.<br>Ou dwe ranpli tout enfòmasyon yo.</p></div></section>`}
function home(){return `<section class="screen">${head('Ti Kanè m','Sere jodi, jwenn demen.',false)}<div class="content"><button class="btn yellow" style="float:right" onclick="go('login')">Konekte</button><div style="clear:both"></div><div class="card" style="padding:0;overflow:hidden">${img('header.jpg')}</div><div class="paystrip" style="margin:8px 0"> <a href="tel:50956352060">🔴<br>NatCash<br><small>509 56352060</small></a><a href="tel:50944462245">🔴<br>MonCash<br><small>509 44462245</small></a><a>▣<br>Cash</a></div><h3>Fonksyonalite yo</h3><div class="row"><button class="btn" onclick="go('chat')">💬<br>Chat<br><small>Rete an kontak</small></button><button class="btn yellow" onclick="go('market')">🛒<br>Marketplace<br><small>Achte & vann</small></button></div></div>${nav('home')}</section>`}
const chats=[['Jean Pierre','Mèsi anpil 🙏','10:23','2'],['Marie Lucie','Ok, n ap wè demen.','09:47',''],['Dousa','Mwen ap aktif kounye a.','08:32','1'],['Fanfan','Bonjou, èske gen plan 50G?','07:15',''],['Paul','Mèsi frè!','Hier','3'],['Lina','Ala bon, m ap li kounye a.','Hier',''],['Kervens','Ok bro, n ap pran l.','Lun','1']];
function chat(){return `<section class="screen">${head('Chat','') }<div class="content"><div style="display:flex;gap:14px;justify-content:flex-end;font-size:22px">⌕　♟</div><div class="tabs"><button class="tab active">Tout</button><button class="tab">Moun</button><button class="tab">Gwoup</button></div>${chats.map((c,i)=>`<div class="listitem" onclick="${i===0?'go(\'conversation\')':''}">${img('tikanem-logo.png','avatar')}<div class="grow"><div class="name">${c[0]}</div><div class="preview">${c[1]}</div></div><div class="time">${c[2]}<br>${c[3]?`<span class="badge">${c[3]}</span>`:''}</div></div>`).join('')}</div>${nav('chat')}</section>`}
function conversation(){return `<section class="screen">${head('Jean Pierre','🟢 Online') }<div class="chat"><div class="bubble left">Bonjour frè, ou la?<br><small>09:12</small></div><div class="bubble right">Wi, m la. Menm jan. E ou?<br><small>09:15 ✓✓</small></div><div class="bubble left">Mèsi! Mwen bezwen konnen si plan 50G la toujou disponib?<br><small>09:18</small></div><div class="bubble right">Wi, li disponib. Ou ka aktive l kounye a.<br><small>09:20 ✓✓</small></div><div class="bubble left">Ok, m ap fè sa. Mèsi anpil!<br><small>09:22</small></div><div class="bubble right">Pa gen pwoblèm! 🙏<br><small>09:23 ✓✓</small></div><div class="bubble left">Mèsi anpil!<br><small>10:21</small></div></div><div class="composer"><input placeholder="Ekri yon mesaj..."><button class="btn">➤</button></div></section>`}
function market(){let products=[['Samsung A14','22,000 G'],['Moto 125','85,000 G'],['Laptop HP','45,000 G'],['T-shirt gason','1,500 G']];return `<section class="screen">${head('Marketplace','') }<div class="content"><div class="tabs"><button class="tab active">Tout</button><button class="tab">Vann</button><button class="tab">Achte</button><button class="tab">Echanj</button></div><div class="products">${products.map((p,i)=>`<div class="product">${img(['plans/10G.jpg','plans/250G.jpg','plans/1000G.jpg','plans/5G.jpg'][i])}<div class="pbody"><b>${p[0]}</b><div class="price">${p[1]}</div><small>📍 Pòtoprens</small></div></div>`).join('')}</div></div>${nav('market')}</section>`}
function profile(){return `<section class="screen"><div class="profilehead"><div class="top"><button class="back" onclick="go('home')">‹</button><div class="grow"><div class="brand">Pwofil</div></div><b>⚙</b></div><div class="profilebox" style="margin-top:16px">${img('tikanem-logo.png','bigavatar')}<div><div class="brand">Jean Pierre</div><div>+509 3726 4589</div><div class="online">● Online</div></div></div></div><div class="content">${[['♟','Enfòmasyon mwen'],['▣','Plan mwen yo'],['▣','Peman mwen yo'],['⚙','Sèvi'],['♢','Anviwònman'],['?','Sant èd']].map(x=>`<div class="menurow"><span>${x[0]}</span><span>${x[1]}</span><span>›</span></div>`).join('')}</div>${nav('profile')}</section>`}
function render(){let s=state.screen;app.innerHTML=s==='splash'?splash():s==='login'?login():s==='plans'?plansScreen():s==='detail'?detail():s==='request'?request():s==='home'?home():s==='chat'?chat():s==='conversation'?conversation():s==='market'?market():profile()}
function go(s){state.screen=s;render();window.scrollTo(0,0)}
function selectPlan(p){state.plan=p;go('detail')}
function toast(t){const e=document.getElementById('toast');e.innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>e.innerHTML='',2200)}
setTimeout(()=>go('login'),1700);render();
</script></body></html>
