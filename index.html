<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0754c8">
<meta name="description" content="Ti Kanè m — Sere jodi, jwenn demen.">
<title>Ti Kanè m</title>
<link rel="stylesheet" href="public/style.css">
</head>
<body>
<main id="app" class="app"></main>
<div id="drawer" class="drawer" onclick="closeDrawer(event)"><div class="drawerbox" onclick="event.stopPropagation()"><div class="topbar"><b>Ti Kanè m</b><div class="grow"></div><button class="iconbtn" onclick="closeDrawer()">×</button></div><hr>
<button class="draweritem" onclick="go('home')">🏠 Akèy</button><button class="draweritem" onclick="go('plans')">📋 Plan yo</button><button class="draweritem" onclick="go('chat')">💬 Chat</button><button class="draweritem" onclick="go('market')">🛒 Marketplace</button><button class="draweritem" onclick="go('profile')">👤 Pwofil</button><button class="draweritem" onclick="go('admin')">🔐 Admin</button><button class="draweritem" onclick="go('settings')">⚙️ Anviwònman</button>
</div></div>
<div id="toast"></div>
<input id="photo" type="file" accept="image/*" hidden onchange="setPhoto(event)">
<input id="productPhoto" type="file" accept="image/*" hidden onchange="setProductPhoto(event)">
<script>
const progressive=[['Plan 1','5G'],['Plan 2','10G'],['Plan 3','25G'],['Plan 4','50G'],['Plan 5','100G']];
const fixed=[['Plan250G','250G'],['Plan500G','500G'],['Plan1000G','1000G']];
const people=[['Jean Pierre','Mèsi anpil! 🙏','10:23'],['Marie Lucie','Ok, n ap wè demen.','09:47'],['Dousa','Plan an aktif kounye a.','08:32'],['Fanfan','Bonjou, èske gen plan 50G?','07:15'],['Paul','Mèsi frè!','Yè'],['Lina','Ala bon, m ap li ki kounye a.','Yè'],['Kervens','Ok bro, n ap pran l.','Lun']];
let products=JSON.parse(localStorage.getItem('tm_products')||'[]');
let orders=JSON.parse(localStorage.getItem('tm_orders')||'[]');
let messages=JSON.parse(localStorage.getItem('tm_messages')||'[]');
let photo=localStorage.getItem('tm_photo')||'';
let account=JSON.parse(localStorage.getItem('tm_account')||'null');
let current='welcome',selected=progressive[4],pending='';
const app=document.getElementById('app');
function logo(){return '<div class="logo"><div class="logo-mark">TM</div><div><div class="logo-name">Ti Kanè m</div><div class="tag">Sere jodi, jwenn demen.</div></div></div>'}
function top(title='',sub='',back=true){return '<header class="hero"><div class="topbar">'+(back?'<button class="back" onclick="go(\'home\')">‹</button>':'')+'<button class="iconbtn" onclick="openDrawer()">☰</button><div class="grow">'+logo()+'</div><button class="iconbtn" onclick="go(\'settings\')">⚙</button></div>'+(title?'<div style="font-size:13px;margin-top:9px;font-weight:800">'+title+'</div>':'')+(sub?'<div class="tag">'+sub+'</div>':'')+'</header>'}
function nav(active){return '<nav class="bottom"><button class="nav '+(active==='home'?'active':'')+'" onclick="go(\'home\')"><span>⌂</span>Akèy</button><button class="nav '+(active==='chat'?'active':'')+'" onclick="go(\'chat\')"><span>◌</span>Chat</button><button class="nav '+(active==='market'?'active':'')+'" onclick="go(\'market\')"><span>▦</span>Marketplace</button><button class="nav '+(active==='plans'?'active':'')+'" onclick="go(\'plans\')"><span>▣</span>Plan yo</button><button class="nav '+(active==='profile'?'active':'')+'" onclick="go(\'profile\')"><span>♙</span>Pwofil</button></nav>'}
function welcome(){return '<section class="welcome"><div>'+logo()+'</div><div class="welcome-art"><div class="person">🧑🏾‍💼</div><h1>Kòmanse bati<br><strong>pwòjè w</strong></h1><p>Chwazi plan.</p></div><div class="paybox"><div>💳<br><small>NatCash</small></div><div>💳<br><small>MonCash</small></div><div>💵<br><small>Cash</small></div></div><div style="margin-top:auto"><button class="btn yellow full" onclick="go('login')">Konekte</button><button class="btn full" style="margin-top:8px;background:#fff;color:#0754c8" onclick="register()">Enskri</button><button class="btn full" style="margin-top:8px;background:transparent;color:#fff;border:1px solid #ffffff66" onclick="guest()">Kontinye kòm envite</button></div></section>'}
function login(){return '<section class="screen">'+top('Byenveni tounen !','Konekte ak kont ou pou kontinye.',false)+'<div class="content"><div class="login"><div class="row" style="margin:15px 0"><button class="pill active">Konekte</button><button class="pill" onclick="register()">Enskri</button></div><div class="field"><input id="loginId" autocomplete="username" placeholder="👤 Imèl oswa telefòn"></div><div class="field"><input id="loginPass" type="password" autocomplete="current-password" placeholder="🔒 Modpas"></div><div class="check"><label><input id="remember" type="checkbox" checked> Sonje mwen</label><button class="seller-link" onclick="resetPassword()">Bliye modpas?</button></div><button class="btn full" onclick="doLogin()">Konekte</button><div style="text-align:center;margin:12px 0;color:#71809a">— oswa —</div><div class="row"><button class="pill" onclick="toast('Google ap vini nan pwochen vèsyon an')">🇬 Google</button><button class="pill" onclick="toast('Facebook ap vini nan pwochen vèsyon an')">ⓕ Facebook</button></div><p style="text-align:center;font-size:12px">Pa gen kont? <button class="seller-link" onclick="register()"><b>Enskri kounye a</b></button></p></div></div></section>'}
function register(){app.innerHTML='<section class="screen">'+top('Kreye kont','Ranpli enfòmasyon yo',true)+'<div class="content"><div class="login"><div class="field"><input id="regName" placeholder="👤 Non konplè"></div><div class="field"><input id="regId" placeholder="📞 Telefòn oswa imèl"></div><div class="field"><input id="regPass" type="password" placeholder="🔒 Kreye yon modpas (6+ karaktè)"></div><button class="btn yellow full" onclick="doRegister()">Kreye kont</button><p style="text-align:center;font-size:12px">Ou deja gen kont? <button class="seller-link" onclick="go('login')">Konekte</button></p></div></div></section>'}
function doRegister(){const n=document.getElementById('regName').value.trim(),id=document.getElementById('regId').value.trim(),pw=document.getElementById('regPass').value;if(n.length<2||id.length<3||pw.length<6){toast('Tanpri ranpli tout chan yo');return}account={name:n,id:id,password:pw};localStorage.setItem('tm_account',JSON.stringify(account));localStorage.setItem('tm_session','1');toast('Kont kreye ✔');go('home')}
function doLogin(){const id=document.getElementById('loginId').value.trim(),pw=document.getElementById('loginPass').value;if(!id||!pw){toast('Mete imèl/telefòn ak modpas');return}if(account&&account.id===id&&account.password===pw){localStorage.setItem('tm_session','1');toast('Koneksyon reyisi ✔');go('home');return}if(!account){toast('Pa gen kont lokal. Chwazi Enskri.');return}toast('Imèl/telefòn oswa modpas pa bon')}
function resetPassword(){toast('Pou kounye a, kreye yon nouvo kont oswa itilize menm aparèy la. Reyajisteman pa imel ap vini.')}
function guest(){localStorage.setItem('tm_guest','1');toast('Mòd envite aktive ✔');go('home')}
function userName(){return account&&account.name?account.name:'Vizitè'}
function home(){return '<section class="screen">'+top('','',false)+'<div class="content"><div class="card"><div style="font-size:12px;color:#71809a">☀️ Bonjou</div><h3 style="margin:5px 0">Bonjou '+safe(userName())+'</h3><small>Gen yon bèl jounen devan ou!</small></div><div class="banner"><h2>Chwazi plan ou</h2><p>5 plan pwogresif • 3 plan fikse</p><button class="btn yellow" onclick="go('plans')">Gade plan yo</button></div><div class="quick"><button onclick="go('plans')"><i>▣</i>Plan yo</button><button onclick="go('market')"><i>🛒</i>Marketplace</button><button onclick="go('chat')"><i>💬</i>Chat</button><button onclick="go('profile')"><i>♙</i>Pwofil</button></div><div class="section-title"><h3>Pwodwi popilè</h3><span>Plis ›</span></div><div class="product-row">'+['📱 Samsung A14','🏍️ Moto 125','💻 Laptop HP'].map(x=>'<div class="product-card"><div class="product-photo">'+x.split(' ')[0]+'</div><small>'+x.substring(2)+'</small><div class="price">22,000 G</div></div>').join('')+'</div></div>'+nav('home')+'</section>'}
function planButtons(list){return list.map(p=>'<button class="plan-card" onclick="selectPlan(\''+p[0]+'\',\''+p[1]+'\')"><small>'+p[0]+'</small><strong>'+p[1]+'</strong><small>Jou</small></button>').join('')}
function plansScreen(){return '<section class="screen">'+top('Plan yo','Plan pwogresif',true)+'<div class="content"><div class="plan-toggle"><button class="pill active" style="flex:1">Plan pwogresif</button><button class="pill" style="flex:1" onclick="showFixed()">Plan fikse</button></div><div class="plans-grid">'+planButtons(progressive)+'</div><div class="card" style="margin-top:14px"><b>Plan pwogresif</b><p>5G, 10G, 25G, 50G ak 100G sèlman. Kantite a evolye selon plan an.</p></div></div>'+nav('plans')+'</section>'}
function showFixed(){app.innerHTML='<section class="screen">'+top('Plan yo','Plan fikse',true)+'<div class="content"><div class="plan-toggle"><button class="pill" style="flex:1" onclick="go(\'plans\')">Plan pwogresif</button><button class="pill active" style="flex:1">Plan fikse</button></div><div class="plans-grid">'+planButtons(fixed)+'</div><div class="card" style="margin-top:14px"><b>Plan fikse</b><p>250G, 500G ak 1000G. Chak jou gen menm kantite a.</p></div></div>'+nav('plans')+'</section>'}
function selectPlan(name,amount){selected=[name,amount];go('detail')}
function detail(){return '<section class="screen">'+top('Detay plan',selected[1]+' pa jou',true)+'<div class="content"><div class="detail-amount"><div>🌐</div><div class="amount">'+selected[1]+'</div><b>Jou</b></div><div class="card"><h3>'+selected[0]+'</h3><ul class="checklist"><li>'+selected[1]+' done</li><li>Lajanman: '+selected[1]+'</li><li>Tipike mobile</li><li>Ka gen plizyè sik (cycle)</li></ul><button class="btn yellow full" onclick="go(\'order\')">Kòmande kounye a</button></div></div>'+nav('plans')+'</section>'}
function order(){return '<section class="screen">'+top('Mande plan','Konfime kòmand lan',true)+'<div class="content"><div class="card"><h3>'+selected[0]+' - '+selected[1]+'</h3><p>👤 Non konplè</p><div class="field"><input id="orderName" value="'+safe(userName()!=='Vizitè'?userName():'')+'" placeholder="Non konplè"></div><p>📞 Telefòn</p><div class="field"><input id="orderPhone" placeholder="+509 ..." inputmode="tel"></div><p>📅 Dat kòmanse</p><div class="field"><input id="orderDate" type="date"></div><button class="btn yellow full" onclick="confirmOrder()">Konfime kòmand lan</button></div><p style="text-align:center;font-size:12px">🛡️ Enfòmasyon yo rete sou aparèy sa a nan vèsyon demonstrasyon an.</p></div></section>'}
function confirmOrder(){const n=document.getElementById('orderName').value.trim(),phone=document.getElementById('orderPhone').value.trim(),date=document.getElementById('orderDate').value;if(!n||!phone||!date){toast('Tanpri ranpli non, telefòn ak dat');return}orders.unshift({id:Date.now(),name:n,phone:phone,date:date,plan:selected[0],amount:selected[1],status:'Nouvo'});localStorage.setItem('tm_orders',JSON.stringify(orders));toast('Kòmand lan konfime ✔');go('profile')}
function avatar(name){return '<div class="avatar">'+safe(name.charAt(0))+'</div>'}
function chat(){return '<section class="screen">'+top('Chat','',true)+'<div class="content"><div class="tabs"><button class="pill active">Tout</button><button class="pill">Moun</button><button class="pill">Gwoup</button></div><div class="card chat-list">'+people.map((p,i)=>'<div class="chat-item" onclick="go(\'conversation\')">'+avatar(p[0])+'<div class="chat-text"><b>'+p[0]+'</b><small>'+p[1]+'</small></div><div class="chat-meta">'+p[2]+'<br>'+(i%3===0?'<span class="badge">'+(i+1)+'</span>':'')+'</div></div>').join('')+'</div></div>'+nav('chat')+'</section>'}
function conversation(){return '<section class="screen">'+top('Jean Pierre','🟢 Online',true)+'<div class="content"><div class="messages"><div class="bubble">Bonjou frè, ou la?<small style="display:block">09:12</small></div><div class="bubble me">Wi, m la. Menm jan. E ou?<small style="display:block">09:15 ✓✓</small></div><div class="bubble">Mèsi! Mwen bezwen konnen si plan 50G la toujou disponib?<small style="display:block">09:18</small></div><div class="bubble me">Wi, li disponib. Ou ka aktive l kounye a.<small style="display:block">09:20 ✓✓</small></div><div class="bubble">Mèsi anpil! 🙏<small style="display:block">10:21</small></div>'+messages.map(m=>'<div class="bubble me">'+safe(m.text)+'<small style="display:block">'+m.time+' ✓</small></div>').join('')+'</div><div class="composer"><input id="msg" placeholder="Ekri yon mesaj..." onkeydown="if(event.key===\'Enter\')send()"><button class="send" onclick="send()">➤</button></div></div></section>'}
function send(){const x=document.getElementById('msg');if(!x||!x.value.trim())return;messages.push({text:x.value.trim(),time:new Date().toLocaleTimeString('ht-HT',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('tm_messages',JSON.stringify(messages));x.value='';toast('Mesaj anrejistre ✔');conversation();}
function market(){return '<section class="screen">'+top('Marketplace','',true)+'<div class="content"><div class="tabs"><button class="pill active">Tout</button><button class="pill">Vann</button><button class="pill">Achte</button><button class="pill">Echanj</button></div><div class="market-grid">'+[['📱','Samsung A14','22,000 G'],['🏍️','Moto 125','85,000 G'],['💻','Laptop HP','45,000 G'],['👕','T-shirt gason','1,500 G']].map(p=>'<div class="market-card"><div class="product-photo">'+p[0]+'</div><h4>'+p[1]+'</h4><div class="price">'+p[2]+'</div><div class="location">📍 Pòtoprens</div></div>').join('')+products.map(p=>'<div class="market-card"><div class="product-photo">'+(p.photo?'<img src="'+p.photo+'">':'📦')+'</div><h4>'+safe(p.name)+'</h4><div class="price">'+safe(p.price)+' G</div><div class="location">📍 Pòtoprens</div></div>').join('')+'</div><button class="btn yellow" style="position:fixed;bottom:88px;right:max(18px,calc((100vw - 440px)/2));border-radius:30px" onclick="go(\'sell\')">＋ Anonse</button></div>'+nav('market')+'</section>'}
function sell(){return '<section class="screen">'+top('Anonse pwodwi','Marketplace',true)+'<div class="content"><div class="card"><button class="btn" onclick="document.getElementById(\'productPhoto\').click()">📷 Chwazi foto</button><div id="preview" style="margin:10px 0"></div><div class="field"><input id="pname" placeholder="Non pwodwi"></div><div class="field"><input id="pprice" placeholder="Pri" inputmode="numeric"></div><div class="field"><textarea id="pdesc" placeholder="Deskripsyon"></textarea></div><button class="btn yellow full" onclick="saveProduct()">Publike pwodwi a</button></div></div></section>'}
function setProductPhoto(e){const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){toast('Foto a twò gwo (maksimòm 2MB)');return}const r=new FileReader();r.onload=()=>{pending=r.result;const p=document.getElementById('preview');if(p)p.innerHTML='<img src="'+pending+'" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px">'};r.readAsDataURL(f)}
function saveProduct(){const n=document.getElementById('pname').value.trim(),p=document.getElementById('pprice').value.replace(/[^0-9.]/g,'');const d=document.getElementById('pdesc').value.trim();if(!n||!p||!pending){toast('Mete foto, non ak pri a');return}products.unshift({name:n,price:p,description:d,photo:pending,seller:userName()});localStorage.setItem('tm_products',JSON.stringify(products));pending='';toast('Pwodwi ajoute ✔');go('market')}
function profile(){return '<section class="screen">'+top('Pwofil','Kont mwen',true)+'<div class="profile-head"><div class="profile-info"><div class="big-avatar">'+(photo?'<img src="'+photo+'">':safe(userName().charAt(0)))+'</div><div><h2 style="margin:0">'+safe(userName())+'</h2><div class="online">● Aktif</div><small>'+(account?safe(account.id):'Mòd envite')+'</small></div></div><div class="stats"><div class="stat"><b>'+orders.length+'</b><small>Kòmand</small></div><div class="stat"><b>'+products.filter(p=>p.seller===userName()).length+'</b><small>Pwodwi</small></div><div class="stat"><b>0</b><small>Balans</small></div></div></div><div class="content"><div class="card"><div class="menurow">📷 <button onclick="document.getElementById(\'photo\').click()">Chanje foto pwofil</button></div><div class="menurow">📋 <button onclick="showOrders()">Kòmand mwen yo</button></div><div class="menurow">⚙️ <button onclick="go(\'settings\')">Anviwònman</button></div><div class="menurow">🚪 <button onclick="logout()">Dekonekte</button></div></div></div>'+nav('profile')+'</section>'}
function showOrders(){if(!orders.length){toast('Ou poko gen kòmand');return}go('orders')}
function ordersScreen(){return '<section class="screen">'+top('Kòmand mwen yo','Istwa kòmand yo',true)+'<div class="content">'+orders.map(o=>'<div class="card"><b>'+safe(o.plan)+' • '+safe(o.amount)+'</b><p style="margin:6px 0">👤 '+safe(o.name)+'<br>📞 '+safe(o.phone)+'<br>📅 '+safe(o.date)+'</p><small>Estati: <b>'+safe(o.status)+'</b></small></div>').join('')+'</div></section>'}
function setPhoto(e){const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){toast('Foto a twò gwo (maksimòm 2MB)');return}const r=new FileReader();r.onload=()=>{photo=r.result;localStorage.setItem('tm_photo',photo);toast('Foto pwofil mete ✔');go('profile')};r.readAsDataURL(f)}
function admin(){return '<section class="screen">'+top('Admin','Rezime aplikasyon an',true)+'<div class="content"><div class="admin-grid"><div class="metric blue">Kòmand<b>'+orders.length+'</b></div><div class="metric green">Pwodwi<b>'+products.length+'</b></div><div class="metric purple">Mesaj<b>'+messages.length+'</b></div><div class="metric yellow">Plan<b>8</b></div></div><div class="card" style="margin-top:12px"><h3>Jesyon</h3><div class="menurow">📋 <button onclick="showOrders()">Gade kòmand yo</button></div><div class="menurow">🛒 <button onclick="go('market')">Gade Marketplace</button></div><div class="menurow">💬 <button onclick="go('chat')">Gade chat</button></div></div><div class="card"><b>Remak</b><p>Admin sa a se yon dashboard lokal demonstrasyon. Backend ak otantifikasyon reyèl poko konekte.</p></div></div></section>'}
function settings(){return '<section class="screen">'+top('Anviwònman','Preferans aplikasyon an',true)+'<div class="content"><div class="card"><div class="menurow">🔔 <button onclick="toast('Notifikasyon aktive sou aparèy sa a')">Notifikasyon</button></div><div class="menurow">🔒 <button onclick="toast('Sekirite avanse ap vini')">Sekirite</button></div><div class="menurow">🌐 <button onclick="toast('Lang: Kreyòl ayisyen')">Lang</button></div><div class="menurow">ℹ️ <button onclick="toast('Ti Kanè m vèsyon 1.0')">Sou aplikasyon an</button></div></div></div></section>'}
function logout(){localStorage.removeItem('tm_session');toast('Ou dekonekte');go('welcome')}
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(page){current=page;closeDrawer();const map={welcome,login,register,home,plans:plansScreen,detail,order,chat,conversation,market,sell,profile,orders:ordersScreen,admin,settings};(map[page]||welcome)();window.scrollTo(0,0)}
function openDrawer(){document.getElementById('drawer').classList.add('open')}
function closeDrawer(e){if(!e||e.target===document.getElementById('drawer'))document.getElementById('drawer').classList.remove('open')}
let toastTimer;function toast(msg){const t=document.getElementById('toast');t.className='toast';t.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='';t.textContent=''},2600)}
render();
function render(){go(localStorage.getItem('tm_session')==='1'?'home':'welcome')}
</script>
</body>
</html>
