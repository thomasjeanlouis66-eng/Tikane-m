<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0754c8"><title>Ti Kanè m</title><style>:root{--b:#0754c8;--y:#ffd51c;--ink:#123b78;--line:#dfe6ef;--bg:#f5f7fb}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#e8edf5;color:var(--ink)}body{display:flex;justify-content:center}.phone{width:min(100%,480px);min-height:100vh;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 30px #0002}.screen{min-height:100vh;padding-bottom:78px}.blue{background:linear-gradient(160deg,#0847aa,#075fe0);color:#fff;padding:13px 16px}.top{display:flex;align-items:center;gap:9px}.brand{font-weight:800;font-size:21px}.tag{font-size:12px;color:#ffe53a}.back{font-size:28px;background:none;border:0;color:#fff}.logo{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--ink)}.logo b{display:grid;place-items:center;width:48px;height:48px;border-radius:10px;background:#fff;color:var(--b);font-size:23px}.logo span{font-size:20px}.content{padding:14px 18px}.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--b);color:#fff;font-weight:800;font-size:14px;cursor:pointer}.yellow{background:var(--y);color:var(--ink)}.full{width:100%}.row{display:flex;gap:10px}.row>*{flex:1}.card{background:#fff;border:1px solid #e0e7f0;border-radius:15px;padding:14px;box-shadow:0 2px 8px #0000000a;margin:10px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);height:68px;background:#fff;border-top:1px solid #dce4ee;display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav{border:0;background:none;color:#174d93;font-size:11px;font-weight:700}.nav.active{color:var(--b)}.nav span{display:block;font-size:22px}.profile{background:linear-gradient(160deg,#0754c8,#0a69dd);padding:18px;color:#fff}.profilebox{display:flex;gap:12px;align-items:center}.big{width:68px;height:68px;border-radius:50%;border:3px solid #fff;background:#0b5ed7;display:grid;place-items:center;font-weight:900;font-size:22px}.online{color:#20d27b;font-size:12px}.menurow{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid #e8edf4;font-weight:700}.menurow button{border:0;background:transparent;color:inherit;font:inherit;padding:0;text-align:left;flex:1;cursor:pointer}.menurow .arrow{margin-left:auto}.drawer{position:fixed;inset:0;background:#0006;z-index:40;display:none}.drawer.open{display:block}.drawerbox{position:absolute;left:0;top:0;bottom:0;width:min(86%,390px);background:#fff;padding:22px 18px;box-shadow:8px 0 25px #0003}.drawerhead{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}.draweritem{display:flex;align-items:center;gap:13px;padding:15px 8px;border:0;background:#fff;width:100%;text-align:left;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer}.draweritem span:first-child{font-size:21px;width:28px}.closemenu{border:0;background:#eef3fa;border-radius:50%;width:36px;height:36px;font-size:22px;color:var(--ink)}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#123b78;color:#fff;padding:10px 14px;border-radius:10px;z-index:50;font-size:12px}</style></head><body><main class="phone" id="app"></main><div id="toast"></div><div id="menuDrawer" class="drawer" onclick="closeMenu(event)"><div class="drawerbox" onclick="event.stopPropagation()"><div class="drawerhead"><b>Ti Kanè m</b><button class="closemenu" onclick="closeMenu()">×</button></div><div style="margin:12px 0 8px;font-size:12px;color:#6e829f">MENU TI KANÈ M</div><button class="draweritem" onclick="goFromMenu('home')"><span>🏠</span><span>Akèy</span></button><button class="draweritem" onclick="goFromMenu('plans')"><span>📋</span><span>Plan yo</span></button><button class="draweritem" onclick="goFromMenu('chat')"><span>💬</span><span>Chat</span></button><button class="draweritem" onclick="goFromMenu('market')"><span>🛒</span><span>Marketplace</span></button><button class="draweritem" onclick="goFromMenu('profile')"><span>👤</span><span>Pwofil</span></button><button class="draweritem" onclick="goFromMenu('admin')"><span>🔐</span><span>Admin</span></button><button class="draweritem" onclick="shareApp()"><span>📤</span><span>Pataje</span></button></div></div><script>const plans=[['Plan 1','5G'],['Plan 2','10G'],['Plan 3','25G'],['Plan 4','50G'],['Plan 5','100G'],['Plan 6','250G'],['Plan 7','500G'],['Plan 8','1000G']];let state={screen:'splash',plan:null};const app=document.getElementById('app');function logo(){return'<div class="logo"><b>TM</b><span>Ti Kanè m</span></div>'}function head(t,sub='',back=true){return'<div class="blue"><div class="top">'+(back?'<button class="back" onclick="go(\'home\')">‹</button>':'')+logo()+'<div><div class="brand">'+t+'</div><div class="tag">'+sub+'</div></div></div></div>'}function nav(a){return'<div class="bottom"><button class="nav '+(a==='home'?'active':'')+'" onclick="openMenu()"><span>⌂</span>Menu</button><button class="nav '+(a==='chat'?'active':'')+'" onclick="go(\'chat\')"><span>◌</span>Chat</button><button class="nav '+(a==='market'?'active':'')+'" onclick="go(\'market\')"><span>▦</span>Marketplace</button><button class="nav '+(a==='profile'?'active':'')+'" onclick="go(\'profile\')"><span>♙</span>Pwofil</button></div>}function profile(){let rows=[['♟','Enfòmasyon mwen','info'],['▣','Plan mwen yo','plans'],['▣','Peman mwen yo','payments'],['⚙','Sèvi','support'],['♢','Anviwònman','settings'],['?','Sant èd','help']];return'<section class="screen"><div class="profile"><div class="top"><button class="back" onclick="go(\'home\')">‹</button><div class="grow"><div class="brand">Pwofil</div></div><b>⚙</b></div><div class="profilebox" style="margin-top:16px"><div class="big">TM</div><div><div class="brand">Jean Pierre</div><div>+509 3726 4589</div><div class="online">● Online</div></div></div></div><div class="content">'+rows.map(x=>'<div class="menurow"><span>'+x[0]+'</span><button onclick="profileAction(\''+x[2]+'\')">'+x[1]+'</button><span class="arrow">›</span></div>').join('')+'</div>'+nav('profile')+'</section>'}function profileAction(a){if(a==='plans')go('plans');else if(a==='info')go('profileInfo');else if(a==='payments')go('payments');else if(a==='settings')go('settings');else if(a==='support')toast('Sèvi: sèvis sipò a ap prepare ✔');else if(a==='help')toast('Sant èd: seksyon èd la ap prepare ✔')}function simplePage(title,text){return'<section class="screen">'+head(title)+'<div class="content"><div class="card"><h3 style="margin-top:0">'+title+'</h3><p>'+text+'</p><button class="btn" onclick="go(\'profile\')">← Retounen nan pwofil</button></div></div>'+nav('profile')+'</section>'}function plansScreen(){return'<section class="screen">'+head('Ti Kanè m','Sere jodi, jwenn demen.',false)+'<div class="content"><h1>Chwazi plan ou</h1><b style="color:#d9a900">8 plan sèlman • 2×4</b><div class="plans" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px">'+plans.map(p=>'<button class="btn" onclick="selectPlan(\''+p[1]+'\')"><small>'+p[0]+'</small><strong style="display:block;color:var(--y);font-size:19px;margin:8px 0">'+p[1]+'</strong><small>Jou</small></button>').join('')+'</div></div></section>'}function home(){return'<section class="screen">'+head('Ti Kanè m','Sere jodi, jwenn demen.',false)+'<div class="content"><h3>Fonksyonalite yo</h3><div class="row"><button class="btn" onclick="go(\'chat\')">💬<br>Chat</button><button class="btn yellow" onclick="go(\'market\')">🛒<br>Marketplace</button></div></div>'+nav('home')+'</section>'}function chat(){return'<section class="screen">'+head('Chat')+'<div class="content"><div class="card" onclick="go(\'conversation\')">💬 Jean Pierre<br><small>Mèsi anpil 🙏</small></div></div>'+nav('chat')+'</section>'}function conversation(){return'<section class="screen">'+head('Jean Pierre','🟢 Online')+'<div class="content"><div class="card">Bonjour frè, ou la?<br><br>Wi, m la.</div></div></section>'}function market(){return'<section class="screen">'+head('Marketplace')+'<div class="content"><div class="card">📱 Samsung A14<br><b>22,000 G</b></div><div class="card">💻 Laptop HP<br><b>45,000 G</b></div></div>'+nav('market')+'</section>'}function admin(){return'<section class="screen">'+head('Admin','Administrasyon Ti Kanè m')+'<div class="content"><div class="card"><h3>🔐 Zòn Admin</h3><p>Espas administratè a pare pou resevwa fonksyon administrasyon yo.</p></div></div>'+nav('home')+'</section>'}function openMenu(){document.getElementById('menuDrawer').classList.add('open')}function closeMenu(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('menuDrawer').classList.remove('open')}function goFromMenu(s){closeMenu();go(s)}function shareApp(){let u=location.href;if(navigator.share){navigator.share({title:'Ti Kanè m',text:'Gade Ti Kanè m.',url:u}).catch(()=>{})}else{try{navigator.clipboard.writeText(u);toast('Lyen Ti Kanè m kopye ✔')}catch(e){toast('Pataje: '+u)}}}function go(s){state.screen=s;render();window.scrollTo(0,0)}function selectPlan(p){state.plan=p;go('detail')}function toast(t){let e=document.getElementById('toast');e.innerHTML='<div class="toast">'+t+'</div>';setTimeout(()=>e.innerHTML='',2400)}function render(){let s=state.screen;app.innerHTML=s==='plans'?plansScreen():s==='home'?home():s==='chat'?chat():s==='conversation'?conversation():s==='market'?market():s==='admin'?admin():s==='profileInfo'?simplePage('Enfòmasyon mwen','Ou ka mete epi modifye non, telefòn ak lòt enfòmasyon pèsonèl ou isit la.'):s==='payments'?simplePage('Peman mwen yo','Istwa ak detay peman ou yo ap parèt isit la.'):s==='settings'?simplePage('Anviwònman','Paramèt kont ak preferans aplikasyon an ap parèt isit la.'):s==='profile'?profile():home()}setTimeout(()=>go('home'),500);render();</script></body></html>
