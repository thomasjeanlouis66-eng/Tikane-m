<!doctype html>
<html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0754c8"><title>Ti Kanè m</title><link rel="stylesheet" href="public/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="public/supabase-config.js"></script></head><body><main id="app" class="app"></main><div id="drawer" class="drawer" onclick="closeDrawer(event)"><div class="drawerbox" onclick="event.stopPropagation()"><div class="topbar"><b>Ti Kanè m</b><div class="grow"></div><button class="iconbtn" onclick="closeDrawer()">×</button></div><hr><button class="draweritem" onclick="go('home')">🏠 Akèy</button><button class="draweritem" onclick="go('plans')">📋 Plan yo</button><button class="draweritem" onclick="go('chat')">💬 Chat</button><button class="draweritem" onclick="go('market')">🛒 Marketplace</button><button class="draweritem" onclick="go('profile')">👤 Pwofil</button><button class="draweritem" onclick="go('admin')">🔐 Admin</button><button class="draweritem" onclick="go('settings')">⚙️ Anviwònman</button></div></div><div id="toast"></div>
<script>
const sb=window.supabase.createClient(window.TIKANE_SUPABASE.url,window.TIKANE_SUPABASE.anonKey);const progressive=[['Plan 1','5G'],['Plan 2','10G'],['Plan 3','25G'],['Plan 4','50G'],['Plan 5','100G']],fixed=[['Plan250G','250G'],['Plan500G','500G'],['Plan1000G','1000G']];let session=null,profileData=null,selected=progressive[4],current='welcome',people=[];
const app=document.getElementById('app');
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(m){const t=document.getElementById('toast');t.className='toast';t.textContent=m;clearTimeout(window.tt);window.tt=setTimeout(()=>{t.className='';t.textContent=''},2500)}function logo(){return '<div class="logo"><div class="logo-mark">TM</div><div><div class="logo-name">Ti Kanè m</div><div class="tag">Sere jodi, jwenn demen.</div></div></div>'}function top(title='',sub='',back=true){return '<header class="hero"><div class="topbar">'+(back?'<button class="back" onclick="go(\'home\')">‹</button>':'')+'<button class="iconbtn" onclick="openDrawer()">☰</button><div class="grow">'+logo()+'</div><button class="iconbtn" onclick="go(\'settings\')">⚙</button></div>'+(title?'<div style="font-size:13px;margin-top:9px;font-weight:800">'+title+'</div>':'')+(sub?'<div class="tag">'+sub+'</div>':'')+'</header>'}function nav(a){return '<nav class="bottom"><button class="nav '+(a==='home'?'active':'')+'" onclick="go(\'home\')"><span>⌂</span>Akèy</button><button class="nav '+(a==='chat'?'active':'')+'" onclick="go(\'chat\')"><span>◌</span>Chat</button><button class="nav '+(a==='market'?'active':'')+'" onclick="go(\'market\')"><span>▦</span>Marketplace</button><button class="nav '+(a==='plans'?'active':'')+'" onclick="go(\'plans\')"><span>▣</span>Plan yo</button><button class="nav '+(a==='profile'?'active':'')+'" onclick="go(\'profile\')"><span>♙</span>Pwofil</button></nav>'}
function welcome(){return '<section class="welcome"><div>'+logo()+'</div><div class="welcome-art"><div class="person">🧑🏾‍💼</div><h1>Kòmanse bati<br><strong>pwòjè w</strong></h1><p>Chwazi plan.</p></div><div class="paybox"><div>💳<br><small>NatCash</small></div><div>💳<br><small>MonCash</small></div><div>💵<br><small>Cash</small></div></div><div style="margin-top:auto"><button class="btn yellow full" onclick="go('login')">Konekte</button><button class="btn full" style="margin-top:8px;background:#fff;color:#0754c8" onclick="go('register')">Enskri</button><button class="btn full" style="margin-top:8px;background:transparent;color:#fff;border:1px solid #ffffff66" onclick="guest()">Kontinye kòm envite</button></div></section>'}
function login(){return '<section class="screen">'+top('Byenveni tounen !','Konekte ak kont ou',false)+'<div class="content"><div class="login"><div class="field"><input id="loginEmail" type="email" placeholder="📧 Imèl"></div><div class="field"><input id="loginPass" type="password" placeholder="🔒 Modpas"></div><div class="check"><label><input type="checkbox" checked> Sonje mwen</label><button class="seller-link" onclick="resetPassword()">Bliye modpas?</button></div><button class="btn full" onclick="doLogin()">Konekte</button><p style="text-align:center;font-size:12px">Pa gen kont? <button class="seller-link" onclick="go('register')"><b>Enskri kounye a</b></button></p></div></div></section>'}
function register(){app.innerHTML='<section class="screen">'+top('Kreye kont','Enskri ak Supabase',true)+'<div class="content"><div class="login"><div class="field"><input id="regName" placeholder="👤 Non konplè"></div><div class="field"><input id="regEmail" type="email" placeholder="📧 Imèl"></div><div class="field"><input id="regPhone" placeholder="📞 Telefòn"></div><div class="field"><input id="regPass" type="password" placeholder="🔒 Modpas (6+ karaktè)"></div><button class="btn yellow full" onclick="doRegister()">Kreye kont</button><p style="text-align:center;font-size:12px">Ou deja gen kont? <button class="seller-link" onclick="go('login')">Konekte</button></p></div></div></section>'}
async function doRegister(){const n=regName.value.trim(),e=regEmail.value.trim(),p=regPhone.value.trim(),pw=regPass.value;if(n.length<2||!e||pw.length<6){toast('Tanpri mete non, imèl ak yon modpas 6+ karaktè');return}const {data,error}=await sb.auth.signUp({email:e,password:pw,options:{data:{full_name:n,phone:p}}});if(error){toast(error.message);return}if(data.user){await sb.from('profiles').upsert({user_id:data.user.id,full_name:n,phone:p},{onConflict:'user_id'});toast(data.session?'Kont kreye ✔':'Kont kreye. Verifye imèl ou ✔');go(data.session?'home':'login')}}
async function doLogin(){const e=loginEmail.value.trim(),pw=loginPass.value;if(!e||!pw){toast('Mete imèl ak modpas');return}const {error}=await sb.auth.signInWithPassword({email:e,password:pw});if(error){toast(error.message);return}await loadUser();toast('Koneksyon reyisi ✔');go('home')}async function resetPassword(){const e=prompt('Mete imèl kont ou:');if(!e)return;const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});toast(error?error.message:'Nou voye lyen reyajisteman an nan imèl ou.')}function guest(){session=null;toast('Mòd envite aktive ✔');go('home')}function userName(){return profileData?.full_name||session?.user?.user_metadata?.full_name||'Vizitè'}
function home(){return '<section class="screen">'+top('','',false)+'<div class="content"><div class="card"><div style="font-size:12px;color:#71809a">☀️ Bonjou</div><h3 style="margin:5px 0">Bonjou '+safe(userName())+'</h3><small>Gen yon bèl jounen devan ou!</small></div><div class="banner"><h2>Chwazi plan ou</h2><p>5 plan pwogresif • 3 plan fikse</p><button class="btn yellow" onclick="go(\'plans\')">Gade plan yo</button></div><div class="quick"><button onclick="go('plans')"><i>▣</i>Plan yo</button><button onclick="go('market')"><i>🛒</i>Marketplace</button><button onclick="go('chat')"><i>💬</i>Chat</button><button onclick="go('profile')"><i>♙</i>Pwofil</button></div></div>'+nav('home')+'</section>'}
function planButtons(a){return a.map(p=>'<button class="plan-card" onclick="selectPlan(\''+p[0]+'\',\''+p[1]+'\')"><small>'+p[0]+'</small><strong>'+p[1]+'</strong><small>Jou</small></button>').join('')}function plans(){return '<section class="screen">'+top('Plan yo','Plan pwogresif',true)+'<div class="content"><div class="plan-toggle"><button class="pill active" style="flex:1">Plan pwogresif</button><button class="pill" style="flex:1" onclick="fixedPage()">Plan fikse</button></div><div class="plans-grid">'+planButtons(progressive)+'</div><div class="card" style="margin-top:14px"><b>Plan pwogresif</b><p>5G, 10G, 25G, 50G ak 100G sèlman.</p></div></div>'+nav('plans')+'</section>'}function fixedPage(){app.innerHTML='<section class="screen">'+top('Plan yo','Plan fikse',true)+'<div class="content"><div class="plan-toggle"><button class="pill" style="flex:1" onclick="go(\'plans\')">Plan pwogresif</button><button class="pill active" style="flex:1">Plan fikse</button></div><div class="plans-grid">'+planButtons(fixed)+'</div><div class="card" style="margin-top:14px"><b>Plan fikse</b><p>250G, 500G ak 1000G. Chak jou menm kantite a.</p></div></div>'+nav('plans')+'</section>'}function selectPlan(n,a){selected=[n,a];go('detail')}function detail(){return '<section class="screen">'+top('Detay plan',selected[1]+' pa jou',true)+'<div class="content"><div class="detail-amount"><div>🌐</div><div class="amount">'+selected[1]+'</div><b>Jou</b></div><div class="card"><h3>'+selected[0]+'</h3><ul class="checklist"><li>'+selected[1]+' done</li><li>Lajanman: '+selected[1]+'</li><li>Plizyè sik posib</li></ul><button class="btn yellow full" onclick="go(\'order\')">Kòmande kounye a</button></div></div>'+nav('plans')+'</section>'}
function order(){if(!session){toast('Konekte pou kòmande yon plan');return}return '<section class="screen">'+top('Mande plan','Konfime kòmand lan',true)+'<div class="content"><div class="card"><h3>'+selected[0]+' - '+selected[1]+'</h3><div class="field"><input id="orderName" value="'+safe(userName())+'" placeholder="Non konplè"></div><div class="field"><input id="orderPhone" value="'+safe(profileData?.phone||'')+'" placeholder="+509 ..."></div><div class="field"><input id="orderDate" type="date"></div><button class="btn yellow full" onclick="confirmOrder()">Konfime kòmand lan</button></div></div></section>'}async function confirmOrder(){const n=orderName.value.trim(),p=orderPhone.value.trim(),d=orderDate.value;if(!n||!p||!d){toast('Ranpli non, telefòn ak dat');return}const {error}=await sb.from('customer_plans').insert({user_id:session.user.id,plan_id:selected[0]+'-'+selected[1],full_name:n,phone:p,start_date:d});if(error){toast(error.message);return}await sb.from('profiles').upsert({user_id:session.user.id,full_name:n,phone:p},{onConflict:'user_id'});toast('Kòmand lan voye ✔');go('profile')}
async function market(){let {data,error}=await sb.from('marketplace_posts').select('*').order('created_at',{ascending:false});if(error){toast(error.message);data=[]}return '<section class="screen">'+top('Marketplace','',true)+'<div class="content"><div class="tabs"><button class="pill active">Tout</button><button class="pill" onclick="go(\'sell\')">Vann</button></div><div class="market-grid">'+(data||[]).map(p=>'<div class="market-card"><div class="product-photo">'+(p.photos?.[0]?'<img src="'+safe(p.photos[0])+'">':'📦')+'</div><h4>'+safe(p.title)+'</h4><div class="price">'+safe(p.price)+' G</div><div class="location">📍 Marketplace</div></div>').join('')+'</div><button class="btn yellow" style="position:fixed;bottom:88px;right:max(18px,calc((100vw - 440px)/2));border-radius:30px" onclick="go(\'sell\')">＋ Anonse</button></div>'+nav('market')+'</section>'}function sell(){if(!session){toast('Konekte pou vann sou Marketplace');return}return '<section class="screen">'+top('Anonse pwodwi','Marketplace',true)+'<div class="content"><div class="card"><div class="field"><input id="pname" placeholder="Non pwodwi"></div><div class="field"><input id="pprice" placeholder="Pri" inputmode="numeric"></div><div class="field"><textarea id="pdesc" placeholder="Deskripsyon"></textarea></div><button class="btn yellow full" onclick="saveProduct()">Publike pwodwi a</button></div></div></section>'}async function saveProduct(){const n=pname.value.trim(),p=Number(pprice.value.replace(/[^0-9.]/g,'')),d=pdesc.value.trim();if(!n||!p){toast('Mete non ak pri');return}const {error}=await sb.from('marketplace_posts').insert({seller_id:session.user.id,title:n,price:p,description:d,photos:[]});if(error){toast(error.message);return}toast('Pwodwi ajoute ✔');go('market')}
async function chat(){if(!session){return '<section class="screen">'+top('Chat','Konekte pou itilize chat',true)+'<div class="content"><div class="card"><p>Chat la disponib pou itilizatè ki konekte.</p><button class="btn full" onclick="go(\'login\')">Konekte</button></div></div></section>'}let {data}=await sb.from('profiles').select('user_id,full_name,phone').neq('user_id',session.user.id).limit(30);people=data||[];return '<section class="screen">'+top('Chat','Mesaj reyèl',true)+'<div class="content"><div class="card chat-list">'+people.map(p=>'<div class="chat-item" onclick="conversation(\''+p.user_id+'\',\''+safe(p.full_name||'Itilizatè')+'\')"><div class="avatar">'+safe((p.full_name||'U').charAt(0))+'</div><div class="chat-text"><b>'+safe(p.full_name||'Itilizatè')+'</b><small>Voye yon mesaj</small></div></div>').join('')+'</div></div>'+nav('chat')+'</section>'}async function conversation(uid,name){current='conversation';let {data}=await sb.from('chat_messages').select('*').or('and(sender_id.eq.'+session.user.id+',recipient_id.eq.'+uid+'),and(sender_id.eq.'+uid+',recipient_id.eq.'+session.user.id+')').order('created_at');app.innerHTML='<section class="screen">'+top(safe(name),'Chat',true)+'<div class="content"><div class="messages">'+(data||[]).map(m=>'<div class="bubble '+(m.sender_id===session.user.id?'me':'')+'">'+safe(m.body)+'</div>').join('')+'</div><div class="composer"><input id="msg" placeholder="Ekri yon mesaj..." onkeydown="if(event.key===\'Enter\')sendMsg(\''+uid+'\')"><button class="send" onclick="sendMsg(\''+uid+'\')">➤</button></div></div></section>'}async function sendMsg(uid){const x=document.getElementById('msg');if(!x?.value.trim())return;const {error}=await sb.from('chat_messages').insert({sender_id:session.user.id,recipient_id:uid,body:x.value.trim()});if(error){toast(error.message);return}x.value='';conversation(uid,'Konvèsasyon')}
async function profile(){let {data:plans}=session?await sb.from('customer_plans').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false}):{data:[]};return '<section class="screen">'+top('Pwofil','Kont mwen',true)+'<div class="profile-head"><div class="profile-info"><div class="big-avatar">'+safe(userName().charAt(0))+'</div><div><h2 style="margin:0">'+safe(userName())+'</h2><div class="online">● Aktif</div><small>'+safe(session?.user?.email||'Mòd envite')+'</small></div></div><div class="stats"><div class="stat"><b>'+((plans||[]).length)+'</b><small>Kòmand</small></div><div class="stat"><b>—</b><small>Pwodwi</small></div><div class="stat"><b>—</b><small>Balans</small></div></div></div><div class="content"><div class="card"><div class="menurow">📋 <button onclick="go('orders')">Kòmand mwen yo</button></div><div class="menurow">⚙️ <button onclick="go('settings')">Anviwònman</button></div><div class="menurow">🚪 <button onclick="logout()">Dekonekte</button></div></div></div>'+nav('profile')+'</section>'}async function orders(){if(!session){toast('Konekte pou wè kòmand yo');return}let {data}=await sb.from('customer_plans').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false});return '<section class="screen">'+top('Kòmand mwen yo','Istwa kòmand yo',true)+'<div class="content">'+(data||[]).map(o=>'<div class="card"><b>'+safe(o.plan_id)+'</b><p>👤 '+safe(o.full_name)+'<br>📞 '+safe(o.phone)+'<br>📅 '+safe(o.start_date)+'</p></div>').join('')+'</div></section>'}async function admin(){if(!session){toast('Konekte kòm admin');return go('login')}const {data}=await sb.from('user_roles').select('role,is_blocked').eq('user_id',session.user.id).maybeSingle();if(data?.role!=='admin'){return '<section class="screen">'+top('Admin','Aksè limite',true)+'<div class="content"><div class="card"><b>Aksè refize</b><p>Kont sa a pa gen wòl admin.</p></div></div></section>'}return '<section class="screen">'+top('Admin','Jesyon aplikasyon',true)+'<div class="content"><div class="card"><h3>Dashboard admin</h3><p>Wòl ou: <b>admin</b></p><p>RLS Supabase ap pwoteje done yo.</p></div></div></section>'}function settings(){return '<section class="screen">'+top('Anviwònman','Preferans',true)+'<div class="content"><div class="card"><div class="menurow">🔒 <button onclick="toast(\'Otantifikasyon Supabase aktive\')">Sekirite</button></div><div class="menurow">🌐 <button onclick="toast(\'Lang: Kreyòl ayisyen\')">Lang</button></div><div class="menurow">ℹ️ <button onclick="toast(\'Ti Kanè m • Supabase backend\')">Sou aplikasyon an</button></div></div></div></section>'}async function logout(){await sb.auth.signOut();session=null;profileData=null;toast('Ou dekonekte');go('welcome')}
function openDrawer(){document.getElementById('drawer').classList.add('open')}function closeDrawer(e){if(!e||e.target===document.getElementById('drawer'))document.getElementById('drawer').classList.remove('open')}
async function go(page){current=page;closeDrawer();const map={welcome,login,register,home,plans,detail,order,chat,conversation,market,sell,profile,orders,admin,settings};let f=map[page]||welcome;let html=await f();if(typeof html==='string')app.innerHTML=html;window.scrollTo(0,0)}async function loadUser(){const {data}=await sb.auth.getSession();session=data.session;if(session){const r=await sb.from('profiles').select('*').eq('user_id',session.user.id).maybeSingle();profileData=r.data}}sb.auth.onAuthStateChange(async()=>{await loadUser()});(async()=>{await loadUser();go(session?'home':'welcome')})();
</script></body></html>
