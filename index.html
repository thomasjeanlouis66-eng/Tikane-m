<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0754c8">
<title>Ti Kanè m</title>
<link rel="stylesheet" href="public/style.css">
</head>
<body>
<main id="app" class="app"></main>
<div id="drawer" class="drawer" onclick="closeDrawer(event)">
  <div class="drawerbox" onclick="event.stopPropagation()">
    <div class="topbar"><b>Ti Kanè m</b><div class="grow"></div><button class="iconbtn" onclick="closeDrawer()">×</button></div>
    <hr>
    <button class="draweritem" onclick="go('home')">🏠 Akèy</button>
    <button class="draweritem" onclick="go('plans')">📋 Plan yo</button>
    <button class="draweritem" onclick="go('chat')">💬 Chat</button>
    <button class="draweritem" onclick="go('market')">🛒 Marketplace</button>
    <button class="draweritem" onclick="go('profile')">👤 Pwofil</button>
    <button class="draweritem" onclick="go('admin')">🔐 Admin</button>
  </div>
</div>
<div id="toast"></div>
<input id="photo" type="file" accept="image/*" hidden onchange="setPhoto(event)">
<input id="productPhoto" type="file" accept="image/*" hidden onchange="setProductPhoto(event)">
<script>
const progressive=[
  ['Plan 1','5G'],['Plan 2','10G'],['Plan 3','25G'],['Plan 4','50G'],['Plan 5','100G']
];
const fixed=[
  ['Plan250G','250G'],['Plan500G','500G'],['Plan1000G','1000G']
];
let products=JSON.parse(localStorage.getItem('tm_products')||'[]');
let photo=localStorage.getItem('tm_photo')||'';
let current='welcome';
let selected=progressive[4];
const app=document.getElementById('app');

function logo(){return '<div class="logo"><div class="logo-mark">TM</div><div><div class="logo-name">Ti Kanè m</div><div class="tag">Sere jodi, jwenn demen.</div></div></div>'}
function top(title='',sub='',back=true){return '<header class="hero"><div class="topbar">'+(back?'<button class="back" onclick="go(\'home\')">‹</button>':'')+'<div class="grow">'+logo()+'</div><button class="iconbtn" onclick="go(\'settings\')">⚙</button></div>'+(title?'<div style="font-size:13px;margin-top:9px;font-weight:800">'+title+'</div>':'')+(sub?'<div class="tag">'+sub+'</div>':'')+'</header>'}
function nav(active){return '<nav class="bottom"><button class="nav '+(active==='home'?'active':'')+'" onclick="go(\'home\')"><span>⌂</span>Akèy</button><button class="nav '+(active==='chat'?'active':'')+'" onclick="go(\'chat\')"><span>◌</span>Chat</button><button class="nav '+(active==='market'?'active':'')+'" onclick="go(\'market\')"><span>▦</span>Marketplace</button><button class="nav '+(active==='plans'?'active':'')+'" onclick="go(\'plans\')"><span>▣</span>Plan yo</button><button class="nav '+(active==='profile'?'active':'')+'" onclick="go(\'profile\')"><span>♙</span>Pwofil</button></nav>'}
function welcome(){return '<section class="welcome"><div>'+logo()+'</div><div class="welcome-art"><div class="person">🧑🏾‍💼</div><h1>Kòmanse bati<br><strong>pwòjè w</strong></h1><p>Chwazi plan.</p></div><div class="paybox"><div>💳<br><small>NatCash</small></div><div>💳<br><small>MonCash</small></div><div>💵<br><small>Cash</small></div></div><div style="margin-top:auto"><button class="btn yellow full" onclick="go(\'login\')">Konekte</button><button class="btn full" style="margin-top:8px;background:#fff;color:#0754c8" onclick="go(\'login\')">Enskri</button><p style="text-align:center;font-size:11px">Kontinye kòm envite</p></div></section>'}
function login(){return '<section class="screen">'+top('Byenveni tounen !','Konekte ak kont ou pou kontinye.',false)+'<div class="content"><div class="login"><div class="row" style="margin:15px 0"><button class="pill active">Konekte</button><button class="pill" onclick="toast(\'Enskripsyon ap vini\')">Enskri</button></div><div class="field"><input placeholder="👤 Imèl oswa telefòn"></div><div class="field"><input type="password" placeholder="🔒 Modpas"></div><div class="check"><label><input type="checkbox" checked> Sonje mwen</label><button class="seller-link" onclick="toast(\'Lyen pou chanje modpas la ap vini\')">Bliye modpas?</button></div><button class="btn full" onclick="go(\'home\')">Konekte</button><div style="text-align:center;margin:12px 0;color:#71809a">— oswa —</div><div class="row"><button class="pill">🇬 Google</button><button class="pill">ⓕ Facebook</button></div><p style="text-align:center;font-size:12px">Pa gen kont? <b>Enskri kounye a</b></p></div></div></section>'}
function home(){return '<section class="screen">'+top('','',false)+'<div class="content"><div class="card"><div style="font-size:12px;color:#71809a">☀️ Bonjou</div><h3 style="margin:5px 0">Bonjou Jean Pierre</h3><small>Gen yon bèl jounen devan ou!</small></div><div class="banner"><h2>Chwazi plan ou</h2><p>5 plan pwogresif • 3 plan fikse</p><button class="btn yellow" onclick="go(\'plans\')">Gade plan yo</button></div><div class="quick"><button onclick="go(\'plans\')"><i>▣</i>Plan yo</button><button onclick="go(\'market\')"><i>🛒</i>Marketplace</button><button onclick="go(\'chat\')"><i>💬</i>Chat</button><button onclick="go(\'profile\')"><i>♙</i>Pwofil</button></div><div class="section-title"><h3>Pwodwi popilè</h3><span>Plis ›</span></div><div class="product-row">'+['📱 Samsung A14','🏍️ Moto 125','💻 Laptop HP'].map(x=>'<div class="product-card"><div class="product-photo">'+x.split(' ')[0]+'</div><small>'+x.substring(2)+'</small><div class="price">22,000 G</div></div>').join('')+'</div></div>'+nav('home')+'</section>'}
function planButtons(list){return list.map(p=>'<button class="plan-card" onclick="selectPlan(\''+p[0]+'\',\''+p[1]+'\')"><small>'+p[0]+'</small><strong>'+p[1]+'</strong><small>Jou</small></button>').join('')}
function plansScreen(){return '<section class="screen">'+top('Plan yo','Chwazi kategori a',true)+'<div class="content"><div class="plan-toggle"><button class="pill active" style="flex:1">Plan pwogresif</button><button class="pill" style="flex:1" onclick="showFixed()">Plan fikse</button></div><div class="plans-grid">'+planButtons(progressive)+'</div><div class="card" style="margin-top:14px"><b>Plan pwogresif</b><p>5G, 10G, 25G, 50G ak 100G. Kantite a evolye selon plan an.</p></div></div>'+nav('plans')+'</section>'}
function showFixed(){app.innerHTML='<section class="screen">'+top('Plan yo','Plan fikse',true)+'<div class="content"><div class="plan-toggle"><button class="pill" style="flex:1" onclick="go(\'plans\')">Plan pwogresif</button><button class="pill active" style="flex:1">Plan fikse</button></div><div class="plans-grid">'+planButtons(fixed)+'</div><div class="card" style="margin-top:14px"><b>Plan fikse</b><p>250G, 500G ak 1000G. Chak jou gen menm kantite a.</p></div></div>'+nav('plans')+'</section>'}
function selectPlan(name,amount){selected=[name,amount];go('detail')}
function detail(){return '<section class="screen">'+top('Detay plan','Tipike mobile',true)+'<div class="content"><div class="detail-amount"><div style="font-size:15px">🌐</div><div class="amount">'+selected[1]+'</div><b>Jou</b></div><div class="card"><h3>'+selected[0]+'</h3><ul class="checklist"><li>'+selected[1]+' done</li><li>Lajanman: '+selected[1]+'</li><li>Tipike mobile</li><li>Ka gen plizyè sik (cycle)</li></ul><button class="btn yellow full" onclick="go(\'order\')">Kòmande kounye a</button></div></div>'+nav('plans')+'</section>'}
function order(){return '<section class="screen">'+top('Mande plan','Konfime kòmand lan',true)+'<div class="content"><div class="card"><h3>'+selected[0]+' - '+selected[1]+'</h3><p>👤 Non konplè</p><div class="field"><input placeholder="Non konplè"></div><p>📞 Telefòn</p><div class="field"><input placeholder="+509 ..."></div><p>📅 Dat kòmanse</p><div class="field"><input type="date"></div><button class="btn full" onclick="toast(\'Kòmand lan konfime ✔\');go(\'home\')">Konfime</button></div><p style="text-align:center;font-size:12px">🛡️ Ranpli tout enfòmasyon yo pou kontinye.</p></div></section>'}
const people=[['Jean Pierre','Mèsi anpil! 🙏','10:23'],['Marie Lucie','Ok, n ap wè demen.','09:47'],['Dousa','Plan an aktif kounye a.','08:32'],['Fanfan','Bonjou, èske gen plan 50G?','07:15'],['Paul','Mèsi frè!','Yè'],['Lina','Ala bon, m ap li ki kounye a.','Yè'],['Kervens','Ok bro, n ap pran l.','Lun']];
function avatar(name){return '<div class="avatar">'+name.charAt(0)+'</div>'}
function chat(){return '<section class="screen">'+top('Chat','',true)+'<div class="content"><div class="tabs"><button class="pill active">Tout</button><button class="pill">Moun</button><button class="pill">Gwoup</button></div><div class="card chat-list">'+people.map((p,i)=>'<div class="chat-item" onclick="go(\'conversation\')">'+avatar(p[0])+'<div class="chat-text"><b>'+p[0]+'</b><small>'+p[1]+'</small></div><div class="chat-meta">'+p[2]+'<br>'+(i%3===0?'<span class="badge">'+(i+1)+'</span>':'')+'</div></div>').join('')+'</div></div>'+nav('chat')+'</section>'}
function conversation(){return '<section class="screen">'+top('Jean Pierre','🟢 Online',true)+'<div class="content"><div class="messages"><div class="bubble">Bonjou frè, ou la?<small style="display:block">09:12</small></div><div class="bubble me">Wi, m la. Menm jan. E ou?<small style="display:block">09:15 ✓✓</small></div><div class="bubble">Mèsi! Mwen bezwen konnen si plan 50G la toujou disponib?<small style="display:block">09:18</small></div><div class="bubble me">Wi, li disponib. Ou ka aktive l kounye a.<small style="display:block">09:20 ✓✓</small></div><div class="bubble">Mèsi anpil! 🙏<small style="display:block">10:21</small></div></div><div class="composer"><input id="msg" placeholder="Ekri yon mesaj..."><button class="send" onclick="send()">➤</button></div></div></section>'}
function send(){const x=document.getElementById('msg');if(x&&x.value.trim()){toast('Mesaj voye ✔');x.value=''}}
function market(){return '<section class="screen">'+top('Marketplace','',true)+'<div class="content"><div class="tabs"><button class="pill active">Tout</button><button class="pill">Vann</button><button class="pill">Achte</button><button class="pill">Echanj</button></div><div class="market-grid">'+[['📱','Samsung A14','22,000 G'],['🏍️','Moto 125','85,000 G'],['💻','Laptop HP','45,000 G'],['👕','T-shirt gason','1,500 G']].map(p=>'<div class="market-card"><div class="product-photo">'+p[0]+'</div><h4>'+p[1]+'</h4><div class="price">'+p[2]+'</div><div class="location">📍 Pòtoprens</div></div>').join('')+products.map(p=>'<div class="market-card"><div class="product-photo">'+(p.photo?'<img src="'+p.photo+'">':'📦')+'</div><h4>'+safe(p.name)+'</h4><div class="price">'+safe(p.price)+' G</div><div class="location">📍 Pòtoprens</div></div>').join('')+'</div><button class="btn yellow" style="position:fixed;bottom:88px;right:max(18px,calc((100vw - 440px)/2));border-radius:30px" onclick="go(\'sell\')">＋ Anonse</button></div>'+nav('market')+'</section>'}
function sell(){return '<section class="screen">'+top('Anonse pwodwi','Marketplace',true)+'<div class="content"><div class="card"><button class="btn" onclick="document.getElementById(\'productPhoto\').click()">📷 Chwazi foto</button><div id="preview" style="margin:10px 0"></div><div class="field"><input id="pname" placeholder="Non pwodwi"></div><div class="field"><input id="pprice" placeholder="Pri" inputmode="numeric"></div><div class="field"><textarea id="pdesc" placeholder="Deskripsyon"></textarea></div><button class="btn yellow full" onclick="saveProduct()">Publike pwodwi a</button></div></div></section>'}
let pending='';
function setProductPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{pending=r.result;document.getElementById('preview').innerHTML='<img src="'+pending+'" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px">'};r.readAsDataURL(f)}
function saveProduct(){const n=document.getElementById('pname').value.trim(),p=document.getElementById('pprice').value.trim();if(!n||!p||!pending){toast('Mete foto, non ak pri a');return}products.unshift({name:n,price:p,photo:pending});localStorage.setItem('tm_products',JSON.stringify(products));pending='';toast('Pwodwi ajoute ✔');go('market')}
function profile(){return '<section class="screen">'+top('Pwofil','',true)+'<div class="profile-head"><div class="profile-info"><div class="big-avatar">'+(photo?'<img src="'+photo+'">':'JP')+'</div><div><h2 style="margin:0">Jean Pierre</h2><div>Kont itilizatè</div><div class="online">● Online</div><button class="btn yellow" style="padding:7px 10px;margin-top:6px" onclick="document.getElementById(\'photo\').click()">📷 Chanje foto</button></div></div><div class="stats"><div class="stat"><b>5</b><br><small>Plan achte</small></div><div class="stat"><b>12</b><br><small>Achte/Vann</small></div><div class="stat"><b>3</b><br><small>Komimote</small></div></div></div><div class="content">'+[['👤','Enfòmasyon mwen'],['▣','Plan mwen yo'],['💳','Peman mwen yo'],['🛒','Marketplace mwen'],['⚙','Sèvi'],['🔧','Anviwònman'],['❓','Sant èd']].map(x=>'<div class="menurow"><span>'+x[0]+'</span><button onclick="toast(\''+x[1]+' ap prepare\')">'+x[1]+'</button><span>›</span></div>').join('')+'</div>'+nav('profile')+'</section>'}
function admin(){return '<section class="screen">'+top('Admin','Administrasyon Ti Kanè m',true)+'<div class="content"><div class="admin-grid"><div class="metric blue">Itilizatè total<b>1,248</b></div><div class="metric green">Vant total<b>356,780</b></div><div class="metric purple">Plan aktif<b>892</b></div><div class="metric yellow">Marketplace<b>246</b></div></div><div class="card"><h3>Jesyon</h3>'+['Itilizatè yo','Plan yo','Pwodwi yo','Peman','Rapò','Anviwònman'].map(x=>'<div class="menurow"><span>▣</span><button onclick="toast(\''+x+' ap prepare\')">'+x+'</button><span>›</span></div>').join('')+'</div></div>'+nav('home')+'</section>'}
function settings(){return '<section class="screen">'+top('Anviwònman','',true)+'<div class="content card">'+[['🌐','Lang','Kreyòl Ayisyen'],['🔔','Notifikasyon','Gòjè'],['🔒','Sekirite','PIN · Biometrie'],['💾','Done ak depo','Jesyon done'],['❓','Èd ak sipò','Kesyon yo poze souvan'],['📄','Kondisyon itilizasyon',''],['ⓘ','Sou nou','']].map(x=>'<div class="menurow"><span>'+x[0]+'</span><button onclick="toast(\''+x[1]+' ap prepare\')">'+x[1]+'<small style="display:block;color:#71809a;font-weight:400">'+x[2]+'</small></button><span>›</span></div>').join('')+'<button class="btn full" style="background:#f04444;margin-top:14px" onclick="toast(\'Ou soti nan kont lan\')">Soti nan kont</button></div>'+nav('profile')+'</section>'}
function setPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo=r.result;localStorage.setItem('tm_photo',photo);render();toast('Foto mete ✔')};r.readAsDataURL(f)}
function safe(x){return String(x||'').replace(/[&<>"']/g,'')}
function go(s){current=s;closeDrawer();render();scrollTo(0,0)}
function render(){app.innerHTML=current==='welcome'?welcome():current==='login'?login():current==='home'?home():current==='plans'?plansScreen():current==='detail'?detail():current==='order'?order():current==='chat'?chat():current==='conversation'?conversation():current==='market'?market():current==='sell'?sell():current==='profile'?profile():current==='admin'?admin():current==='settings'?settings():home()}
function closeDrawer(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('drawer').classList.remove('open')}
function openDrawer(){document.getElementById('drawer').classList.add('open')}
function toast(t){const e=document.getElementById('toast');e.innerHTML='<div class="toast">'+safe(t)+'</div>';setTimeout(()=>e.innerHTML='',2200)}
render();
</script>
</body>
</html>
