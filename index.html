<!doctype html>
<html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0754c8"><title>Ti Kanè m</title><link rel="stylesheet" href="public/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="public/supabase-config.js" defer></script></head><body><main id="app" class="app"></main><div id="toast"></div><script>
'use strict';
const progressive=[['Plan 1','5G'],['Plan 2','10G'],['Plan 3','25G'],['Plan 4','50G'],['Plan 5','100G']],fixed=[['Plan250G','250G'],['Plan500G','500G'],['Plan1000G','1000G']];
let sb=null,session=null,profileData=null,selected=progressive[0];
const app=document.getElementById('app');
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.className='toast';setTimeout(()=>t.className='',2600)}
function logo(){return '<div class="logo"><div class="logo-mark">TM</div><div><div class="logo-name">Ti Kanè m</div><div class="tag">Sere jodi, jwenn demen.</div></div></div>'}
function top(title='',sub='',back=true){return '<header class="hero"><div class="topbar">'+(back?'<button class="back" onclick="go(\'home\')">‹</button>':'')+'<div class="grow">'+logo()+'</div><button class="iconbtn" onclick="go(\'settings\')">⚙</button></div>'+(title?'<b>'+safe(title)+'</b>':'')+(sub?'<div class="tag">'+safe(sub)+'</div>':'')+'</header>'}
function nav(a){return '<nav class="bottom"><button class="nav '+(a==='home'?'active':'')+'" onclick="go(\'home\')">⌂<small>Akèy</small></button><button class="nav '+(a==='chat'?'active':'')+'" onclick="go(\'chat\')">◌<small>Chat</small></button><button class="nav '+(a==='market'?'active':'')+'" onclick="go(\'market\')">▦<small>Marketplace</small></button><button class="nav '+(a==='plans'?'active':'')+'" onclick="go(\'plans\')">▣<small>Plan yo</small></button><button class="nav '+(a==='profile'?'active':'')+'" onclick="go(\'profile\')">♙<small>Pwofil</small></button></nav>'}
function welcome(){return '<section class="welcome"><div>'+logo()+'</div><div class="welcome-art"><div class="person">🧑🏾‍💼</div><h1>Kòmanse bati<br><strong>pwòjè w</strong></h1><p>Chwazi plan ou epi kòmanse.</p></div><div class="paybox"><div>💳<br><small>NatCash</small></div><div>💳<br><small>MonCash</small></div><div>💵<br><small>Cash</small></div></div><div style="margin-top:auto"><button class="btn yellow full" onclick="go('login')">Konekte</button><button class="btn full" style="margin-top:8px;background:#fff;color:#0754c8" onclick="go('register')">Enskri</button><button class="btn full" style="margin-top:8px;background:transparent;color:#fff;border:1px solid #ffffff66" onclick="go('home')">Kontinye kòm envite</button></div></section>'}
function login(){return '<section class="screen">'+top('Byenveni tounen !','Konekte ak kont ou',false)+'<div class="content"><div class="login"><div class="field"><input id="loginEmail" type="email" placeholder="📧 Imèl"></div><div class="field"><input id="loginPass" type="password" placeholder="🔒 Modpas"></div><button class="btn full" onclick="doLogin()">Konekte</button><p style="text-align:center;font-size:12px">Pa gen kont? <button class="seller-link" onclick="go(\'register\')"><b>Enskri kounye a</b></button></p></div></div></section>'}
function register(){return '<section class="screen">'+top('Kreye kont','Enskri',true)+'<div class="content"><div class="login"><div class="field"><input id="regName" placeholder="👤 Non konplè"></div><div class="field"><input id="regEmail" type="email" placeholder="📧 Imèl"></div><div class="field"><input id="regPhone" placeholder="📞 Telefòn"></div><div class="field"><input id="regPass" type="password" placeholder="🔒 Modpas (6+ karaktè)"></div><button class="btn yellow full" onclick="doRegister()">Kreye kont</button></div></div></section>'}
function home(){return '<section class="screen">'+top('','',false)+'<div class="content"><div class="card"><small>☀️ Bonjou</small><h3>Bonjou '+safe(session?.user?.user_metadata?.full_name||profileData?.full_name||'Vizitè')+'</h3><small>Gen yon bèl jounen devan ou!</small></div><div class="banner"><h2>Chwazi plan ou</h2><p>5 plan pwogresif • 3 plan fikse</p><button class="btn yellow" onclick="go(\'plans\')">Gade plan yo</button></div><div class="quick"><button onclick="go('plans')">▣<br>Plan yo</button><button onclick="go('market')">🛒<br>Marketplace</button><button onclick="go('chat')">💬<br>Chat</button><button onclick="go('profile')">♙<br>Pwofil</button></div></div>'+nav('home')+'</section>'}
function planCards(a){return a.map(p=>'<button class="plan-card" onclick="selectPlan(\''+p[0]+'\',\''+p[1]+'\')"><small>'+p[0]+'</small><strong>'+p[1]+'</strong><small>Jou</small></button>').join('')}
function plans(){return '<section class="screen">'+top('Plan yo','Plan pwogresif',true)+'<div class="content"><div class="plan-toggle"><button class="pill active">Plan pwogresif</button><button class="pill" onclick="go(\'fixed\')">Plan fikse</button></div><div class="plans-grid">'+planCards(progressive)+'</div><div class="card"><b>Plan pwogresif</b><p>5G, 10G, 25G, 50G ak 100G sèlman.</p></div></div>'+nav('plans')+'</section>'}
function fixed(){return '<section class="screen">'+top('Plan yo','Plan fikse',true)+'<div class="content"><div class="plan-toggle"><button class="pill" onclick="go(\'plans\')">Plan pwogresif</button><button class="pill active">Plan fikse</button></div><div class="plans-grid">'+planCards(fixed)+'</div><div class="card"><b>Plan fikse</b><p>250G, 500G ak 1000G.</p></div></div>'+nav('plans')+'</section>'}
function selectPlan(n,a){selected=[n,a];go('detail')}
function detail(){return '<section class="screen">'+top('Detay plan',selected[1]+' pa jou',true)+'<div class="content"><div class="detail-amount"><div>🌐</div><div class="amount">'+selected[1]+'</div><b>Jou</b></div><div class="card"><h3>'+safe(selected[0])+'</h3><p>Plan '+safe(selected[1])+' pou pwojè ou.</p><button class="btn yellow full" onclick="go(\'order\')">Kòmande kounye a</button></div></div>'+nav('plans')+'</section>'}
function order(){if(!session){return '<section class="screen">'+top('Mande plan','Konekte anvan',true)+'<div class="content"><div class="card"><p>Ou bezwen konekte pou kòmande plan an.</p><button class="btn full" onclick="go(\'login\')">Konekte</button></div></div></section>'}return '<section class="screen">'+top('Mande plan',selected[1],true)+'<div class="content"><div class="card"><h3>'+safe(selected[0])+'</h3><div class="field"><input id="orderName" value="'+safe(profileData?.full_name||session.user.user_metadata?.full_name||'')+'" placeholder="Non konplè"></div><div class="field"><input id="orderPhone" value="'+safe(profileData?.phone||session.user.user_metadata?.phone||'')+'" placeholder="Telefòn"></div><div class="field"><input id="orderDate" type="date"></div><button class="btn yellow full" onclick="confirmOrder()">Konfime kòmand lan</button></div></div></section>'}
function market(){return '<section class="screen">'+top('Marketplace','Achte oswa vann',true)+'<div class="content"><div class="tabs"><button class="pill active">Tout</button><button class="pill" onclick="go(\'sell\')">Vann</button></div><div class="market-grid"><div class="card" style="grid-column:1/-1;text-align:center"><div style="font-size:40px">🛒</div><b>Marketplace Ti Kanè m</b><p>Pwodwi yo ap parèt isit la.</p></div></div><button class="btn yellow" onclick="go(\'sell\')">＋ Anonse</button></div>'+nav('market')+'</section>'}
function sell(){if(!session)return '<section class="screen">'+top('Vann','Konekte anvan',true)+'<div class="content"><div class="card"><button class="btn full" onclick="go(\'login\')">Konekte</button></div></div></section>';return '<section class="screen">'+top('Anonse pwodwi','Marketplace',true)+'<div class="content"><div class="card"><div class="field"><input placeholder="Non pwodwi"></div><div class="field"><input placeholder="Pri"></div><div class="field"><textarea placeholder="Deskripsyon"></textarea></div><button class="btn yellow full" onclick="toast(\'Fonksyon an pare pou konekte ak Marketplace\')">Publike pwodwi a</button></div></div></section>'}
function chat(){return '<section class="screen">'+top('Chat','Mesaj',true)+'<div class="content"><div class="card" style="text-align:center"><div style="font-size:42px">💬</div><b>Chat Ti Kanè m</b><p>Konekte pou voye ak resevwa mesaj.</p><button class="btn full" onclick="go(\'login\')">Konekte</button></div></div>'+nav('chat')+'</section>'}
function profile(){return '<section class="screen">'+top('Pwofil','Kont mwen',true)+'<div class="profile-head"><div class="profile-info"><div class="big-avatar">'+safe((session?.user?.user_metadata?.full_name||'V').charAt(0))+'</div><div><h2 style="margin:0">'+safe(session?.user?.user_metadata?.full_name||profileData?.full_name||'Vizitè')+'</h2><small>'+safe(session?.user?.email||'Mòd envite')+'</small></div></div></div><div class="content"><div class="card"><div class="menurow">📋 <button onclick="go(\'orders\')">Kòmand mwen yo</button></div><div class="menurow">⚙️ <button onclick="go(\'settings\')">Anviwònman</button></div>'+ (session?'<div class="menurow">🚪 <button onclick="logout()">Dekonekte</button></div>':'<div class="menurow">🔐 <button onclick="go(\'login\')">Konekte</button></div>')+'</div></div>'+nav('profile')+'</section>'}
function orders(){return '<section class="screen">'+top('Kòmand mwen yo','Suivi plan',true)+'<div class="content"><div class="card"><p>Plan ou yo ap parèt isit la apre ou fin fè yon kòmand.</p><button class="btn yellow" onclick="go(\'plans\')">Chwazi yon plan</button></div></div></section>'}
function settings(){return '<section class="screen">'+top('Anviwònman','Preferans',true)+'<div class="content"><div class="card"><div class="menurow">🔒 <button>Sekirite</button></div><div class="menurow">🌐 <button>Lang: Kreyòl ayisyen</button></div><div class="menurow">ℹ️ <button>Ti Kanè m</button></div></div></div></section>'}
async function confirmOrder(){if(!sb||!session)return toast('Koneksyon Supabase pa disponib');const n=document.getElementById('orderName').value.trim(),p=document.getElementById('orderPhone').value.trim(),d=document.getElementById('orderDate').value;if(!n||!p||!d)return toast('Ranpli non, telefòn ak dat');const r=await sb.from('customer_plans').insert({user_id:session.user.id,plan_id:selected[0]+'-'+selected[1],full_name:n,phone:p,start_date:d});if(r.error)return toast(r.error.message);toast('Kòmand lan voye ✔');go('profile')}
async function doLogin(){if(!sb)return toast('Sèvis koneksyon an poko disponib');const e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPass').value;if(!e||!p)return toast('Mete imèl ak modpas');const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return toast(r.error.message);await loadUser();toast('Koneksyon reyisi ✔');go('home')}
async function doRegister(){if(!sb)return toast('Sèvis enskripsyon an poko disponib');const n=document.getElementById('regName').value.trim(),e=document.getElementById('regEmail').value.trim(),p=document.getElementById('regPhone').value.trim(),pw=document.getElementById('regPass').value;if(n.length<2||!e||pw.length<6)return toast('Tanpri ranpli enfòmasyon yo');const r=await sb.auth.signUp({email:e,password:pw,options:{data:{full_name:n,phone:p}}});if(r.error)return toast(r.error.message);toast(r.data.session?'Kont kreye ✔':'Verifye imèl ou ✔');go(r.data.session?'home':'login')}
async function loadUser(){if(!sb)return;try{const r=await sb.auth.getSession();session=r.data?.session||null;if(session){const p=await sb.from('profiles').select('*').eq('user_id',session.user.id).maybeSingle();profileData=p.data||null}}catch(e){session=null}}
async function logout(){if(sb)await sb.auth.signOut();session=null;profileData=null;go('welcome')}
async function go(page){const map={welcome,login,register,home,plans,fixed,detail,order,market,sell,chat,profile,orders,settings};const f=map[page]||welcome;app.innerHTML=await f();window.scrollTo(0,0)}
async function start(){if(window.supabase?.createClient&&window.TIKANE_SUPABASE?.url){sb=window.supabase.createClient(window.TIKANE_SUPABASE.url,window.TIKANE_SUPABASE.anonKey);await loadUser();if(sb.auth?.onAuthStateChange)sb.auth.onAuthStateChange(()=>loadUser())}go(session?'home':'welcome')}
window.addEventListener('DOMContentLoaded',()=>{setTimeout(start,80)});
</script></body></html>
