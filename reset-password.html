<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0754c8"><title>Modpas bliye — Ti Kanè m</title><link rel="stylesheet" href="public/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="public/supabase-config.js" defer></script></head><body><main class="app"><section class="screen fade"><header class="hero"><div class="topbar"><a class="iconbtn" href="login.html">‹</a><div class="brand"><div class="logo-mark">TM</div><div><b>Ti Kanè m</b><small>Sere jodi, bati demen.</small></div></div><span></span></div><h1 class="title" style="color:#fff">Modpas bliye?</h1><div style="opacity:.85">Nou pral ede w rekipere kont ou</div></header><div class="content"><div class="card"><p class="muted">Mete imèl kont ou. N ap voye yon lyen pou chanje modpas la.</p><label>Imèl<input id="resetEmail" class="input" type="email" placeholder="egzanp@email.com" autocomplete="email"></label><button id="resetBtn" class="btn blue" onclick="sendReset()">Voye lyen an</button><a class="btn ghost" href="login.html" style="display:block;text-align:center;text-decoration:none">Retounen konekte</a></div></div></section></main><div id="toast" class="toast"></div><script>async function sendReset(){const e=(document.getElementById('resetEmail').value||'').trim(),b=document.getElementById('resetBtn');if(!e){toast('Tanpri mete imèl ou.');return}if(!window.supabase||!window.TIKANE_SUPABASE){toast('Sèvis koneksyon an poko pare. Eseye ankò.');return}b.disabled=true;b.textContent='Tanpri tann...';try{const c=window.supabase.createClient(window.TIKANE_SUPABASE.url,window.TIKANE_SUPABASE.anonKey);const r=await c.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname.replace('reset-password.html','login.html')});if(r.error)throw r.error;toast('Lyen rekiperasyon an voye. Tcheke imèl ou.')}catch(err){toast(err.message||'Pa kapab voye lyen an.')}finally{b.disabled=false;b.textContent='Voye lyen an'}}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}</script></body></html>
