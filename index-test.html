<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0754c8">
<title>Ti Kanè m</title>
<link rel="stylesheet" href="public/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="public/supabase-config.js" defer></script>
</head>
<body>
<main id="app" class="app"></main>
<div id="toast"></div>

<script>
'use strict';

let sb=null,session=null,profileData=null,selected=null;

const plans=[
 {name:'Plan5G',daily:5,total:25250},
 {name:'Plan10G',daily:10,total:50500},
 {name:'Plan25G',daily:25,total:126250},
 {name:'Plan50G',daily:50,total:252500},
 {name:'Plan100G',daily:100,total:505000},
 {name:'Plan250G',daily:250,total:25000},
 {name:'Plan500G',daily:500,total:50000},
 {name:'Plan1000G',daily:1000,total:100000}
];

function toast(msg){
 const el=document.getElementById('toast');
 if(!el)return;
 el.textContent=msg;
 el.classList.add('show');
 setTimeout(()=>el.classList.remove('show'),2500);
}

function go(page){
 const map={
  welcome,login,register,home,plans:plansPage,fixed,
  detail,order,market,sell,chat,profile,orders,settings
 };
 const f=map[page]||welcome;
 try{
  document.getElementById('app').innerHTML=f();
  window.scrollTo(0,0);
 }catch(e){
  console.error(e);
  document.getElementById('app').innerHTML=welcome();
 }
}

async function loadUser(){
 if(!sb)return;

 try{
  const {data,error}=await sb.auth.getSession();

  if(error){
   console.error('Session error:',error);
   session=null;
   profileData=null;
   return;
  }

  session=data.session||null;
 }catch(e){
  console.error('Session error:',e);
  session=null;
  profileData=null;
  return;
 }

 profileData=null;

 if(session){
  try{
   const {data,error}=await sb
    .from('profiles')
    .select('*')
    .eq('user_id',session.user.id)
    .maybeSingle();

   if(!error){
    profileData=data||null;
   }else{
    console.warn('Profile error:',error);
   }
  }catch(e){
   console.warn('Profile error:',e);
  }
 }
}

async function doLogin(){
 if(!sb)return toast('Sèvis koneksyon an poko disponib');

 const e=document.getElementById('loginEmail')?.value.trim();
 const p=document.getElementById('loginPass')?.value;

 if(!e||!p)return toast('Mete imèl ak modpas');

 const r=await sb.auth.signInWithPassword({
  email:e,
  password:p
 });

 if(r.error)return toast(r.error.message);

 await loadUser();
 toast('Koneksyon reyisi ✔');
 go('home');
}

async function doRegister(){
 if(!sb)return toast('Sèvis enskripsyon an poko disponib');

 const n=document.getElementById('regName')?.value.trim();
 const e=document.getElementById('regEmail')?.value.trim();
 const p=document.getElementById('regPhone')?.value.trim();
 const pw=document.getElementById('regPass')?.value;

 if(!n||n.length<2||!e||pw.length<6){
  return toast('Tanpri ranpli enfòmasyon yo');
 }

 const r=await sb.auth.signUp({
  email:e,
  password:pw,
  options:{
   data:{
    full_name:n,
    phone:p
   }
  }
 });

 if(r.error)return toast(r.error.message);

 toast(r.data.session?'Kont kreye ✔':'Verifye imèl ou ✔');
 go(r.data.session?'home':'login');
}

async function logout(){
 if(sb)await sb.auth.signOut();
 session=null;
 profileData=null;
 go('welcome');
}

function welcome(){
 return `
 <section class="card">
  <h1>Ti Kanè m</h1>
  <p><b>Sere jodi a, pou bati demen.</b></p>
  <p>Yon ti zouti pou ede w suiv plan ekonomi ou chak jou.</p>
  <button class="btn primary" onclick="go('login')">Konekte</button>
  <button class="btn" onclick="go('register')">Kreye kont</button>
  <button class="btn" onclick="go('plans')">Gade plan yo</button>
 </section>`;
}

function login(){
 return `
 <section class="card">
  <h2>Konekte</h2>
  <input id="loginEmail" type="email" placeholder="Imèl">
  <input id="loginPass" type="password" placeholder="Modpas">
  <button class="btn primary" onclick="doLogin()">Konekte</button>
  <button class="btn" onclick="go('register')">Kreye yon kont</button>
  <button class="btn" onclick="go('welcome')">Retounen</button>
 </section>`;
}

function register(){
 return `
 <section class="card">
  <h2>Kreye kont</h2>
  <input id="regName" type="text" placeholder="Non konplè">
  <input id="regEmail" type="email" placeholder="Imèl">
  <input id="regPhone" type="tel" placeholder="Telefòn">
  <input id="regPass" type="password" placeholder="Modpas">
  <button class="btn primary" onclick="doRegister()">Kreye kont</button>
  <button class="btn" onclick="go('login')">Mwen deja gen kont</button>
 </section>`;
}

function home(){
 const name=profileData?.full_name||session?.user?.user_metadata?.full_name||'Kliyan';

 return `
 <section class="card">
  <h2>Byenveni, ${name}</h2>
  <p>Ou konekte avèk siksè ✔</p>

  <button class="btn primary" onclick="go('plans')">Plan mwen yo</button>
  <button class="btn" onclick="go('fixed')">Plan fiks</button>
  <button class="btn" onclick="go('profile')">Pwofil mwen</button>
  <button class="btn" onclick="go('orders')">Istorik</button>
  <button class="btn" onclick="go('settings')">Paramèt</button>
  <button class="btn" onclick="logout()">Dekonekte</button>
 </section>`;
}

function plansPage(){
 return `
 <section class="card">
  <h2>Plan ekonomi</h2>
  ${plans.map((p,i)=>`
   <button class="btn" onclick="selected=plans[${i}];go('detail')">
    ${p.name} — ${p.daily}G / jou
   </button>
  `).join('')}
  <button class="btn" onclick="go('home')">Akèy</button>
 </section>`;
}

function fixed(){
 return `
 <section class="card">
  <h2>Plan fiks</h2>
  <p>Chwazi yon plan pou kòmanse.</p>
  ${plans.slice(5).map((p,i)=>`
   <button class="btn" onclick="selected=plans[${i+5}];go('detail')">
    ${p.name} — ${p.daily}G / jou
   </button>
  `).join('')}
  <button class="btn" onclick="go('home')">Akèy</button>
 </section>`;
}

function detail(){
 if(!selected)return go('plans');

 return `
 <section class="card">
  <h2>${selected.name}</h2>
  <p>Montan chak jou: <b>${selected.daily} G</b></p>
  <p>Montan total: <b>${selected.total.toLocaleString()} G</b></p>
  <p>Dire: <b>100 jou</b></p>

  <button class="btn primary" onclick="go('order')">Chwazi plan sa</button>
  <button class="btn" onclick="go('plans')">Retounen</button>
 </section>`;
}

function order(){
 if(!selected)return go('plans');

 return `
 <section class="card">
  <h2>Plan chwazi</h2>
  <p>${selected.name}</p>
  <p>${selected.daily} G pa jou</p>
  <p>Total: ${selected.total.toLocaleString()} G</p>

  <button class="btn primary" onclick="toast('Demann lan anrejistre ✔')">
   Konfime
  </button>
  <button class="btn" onclick="go('plans')">Retounen</button>
 </section>`;
}

function market(){
 return `
 <section class="card">
  <h2>Mache</h2>
  <p>Espas pou sèvis ak pwodwi Ti Kanè m.</p>
  <button class="btn" onclick="go('sell')">Vann</button>
  <button class="btn" onclick="go('home')">Akèy</button>
 </section>`;
}

function sell(){
 return `
 <section class="card">
  <h2>Vann</h2>
  <p>Fonksyon vann ap vini.</p>
  <button class="btn" onclick="go('market')">Retounen</button>
 </section>`;
}

function chat(){
 return `
 <section class="card">
  <h2>Chat</h2>
  <p>Chat kliyan ap vini.</p>
  <button class="btn" onclick="go('home')">Akèy</button>
 </section>`;
}

function profile(){
 const name=profileData?.full_name||session?.user?.user_metadata?.full_name||'';
 const email=session?.user?.email||'';

 return `
 <section class="card">
  <h2>Pwofil mwen</h2>
  <p><b>Non:</b> ${name}</p>
  <p><b>Imèl:</b> ${email}</p>
  <button class="btn" onclick="go('home')">Akèy</button>
 </section>`;
}

function orders(){
 return `
 <section class="card">
  <h2>Istorik</h2>
  <p>Pa gen operasyon pou montre pou kounye a.</p>
  <button class="btn" onclick="go('home')">Akèy</button>
 </section>`;
}

function settings(){
 return `
 <section class="card">
  <h2>Paramèt</h2>
  <p>Paramèt kont ou.</p>
  <button class="btn" onclick="go('home')">Akèy</button>
  <button class="btn" onclick="logout()">Dekonekte</button>
 </section>`;
}

async function start(){
 try{
  if(window.supabase?.createClient &&
     window.TIKANE_SUPABASE?.url){

   sb=window.supabase.createClient(
    window.TIKANE_SUPABASE.url,
    window.TIKANE_SUPABASE.anonKey
   );

   await loadUser();

   if(session){
    go('home');
    return;
   }
  }
 }catch(e){
  console.error('Supabase init:',e);
 }

 go('welcome');
}

window.addEventListener('DOMContentLoaded',start,{once:true});
</script>
</body>
</html>
